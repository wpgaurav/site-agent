0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022 class=\u0022sa-icon\u0022 aria-hidden=\u0022true\u0022 focusable=\u0022false\u0022 \u003e \u003cpath stroke=\u0022none\u0022 d=\u0022M0 0h24v24H0z\u0022 fill=\u0022none\u0022 /\u003e \u003cpath d=\u0022M14 3v4a1 1 0 0 0 1 1h4\u0022 /\u003e \u003cpath d=\u0022M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2\u0022 /\u003e \u003cpath d=\u0022M10 13l-1 2l1 2\u0022 /\u003e \u003cpath d=\u0022M14 13l1 2l-1 2\u0022 /\u003e \u003c/svg\u003eChange Content\u003c/h3\u003e\u003cul\u003e\u003cli\u003eCreate drafts\u003c/li\u003e\u003cli\u003eUpdate accessible posts and pages\u003c/li\u003e\u003cli\u003ePreserve omitted fields and block markup\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\n      \u003cdiv\u003e\u003ch3\u003e\u003csvg xmlns=\u0022http://www.w3.org/2000/svg\u0022 width=\u002224\u0022 height=\u002224\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022 class=\u0022sa-icon\u0022 aria-hidden=\u0022true\u0022 focusable=\u0022false\u0022 \u003e \u003cpath stroke=\u0022none\u0022 d=\u0022M0 0h24v24H0z\u0022 fill=\u0022none\u0022 /\u003e \u003cpath d=\u0022M8 9l3 3l-3 3\u0022 /\u003e \u003cpath d=\u0022M13 15l3 0\u0022 /\u003e \u003cpath d=\u0022M3 6a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2l0 -12\u0022 /\u003e \u003c/svg\u003eUse Developer Tools\u003c/h3\u003e\u003cul\u003e\u003cli\u003eBrowse and read source\u003c/li\u003e\u003cli\u003eEdit theme and plugin files\u003c/li\u003e\u003cli\u003eExecute PHP\u003c/li\u003e\u003cli\u003eRun foreground WP-CLI\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\u003c/section\u003e","css":"","js":"(()=\u003e{const root=document.querySelector('.sa');if(!root||root.dataset.saReady)return;root.dataset.saReady='true';const examples={content:{title:'Read a Post Before Editing',copy:'Your agent gets the stored content and its SHA-256 hash. An update must include that hash so the plugin can detect a change made since the read.',access:'Read access',limit:'New content starts as a draft. Publishing needs an explicit request.',call:{name:'site-agent-get-content',arguments:{post_id:42}}},source:{title:'Check a File Before Writing',copy:'Your agent reads a theme or plugin file and receives its hash. File writes check that hash under a lock before replacing the content.',access:'Source inspection + source editing',limit:'PHP syntax is checked first. Source editing can change executable code and break a site.',call:{name:'site-agent-read-file',arguments:{path:'themes/your-theme/style.css'}}},php:{title:'Run PHP Inside WordPress',copy:'Your agent can run PHP with WordPress loaded. The tool returns echoed output and a JSON-compatible return value.',access:'PHP execution opt-in',limit:'PHP has server privileges and is not isolated. An error may leave earlier changes in place.',call:{name:'site-agent-execute-php',arguments:{code:'return get_bloginfo(\u0022version\u0022);'}}},cli:{title:'Run a WP-CLI Command',copy:'Your agent passes WP-CLI arguments as an array. Commands run on this installation as the authenticated WordPress user, without a shell.',access:'WP-CLI execution opt-in',limit:'Foreground commands have a 20-second limit. WP-CLI and process execution must be available on the server.',call:{name:'site-agent-run-wp-cli',arguments:{arguments:['plugin','list','\u002d\u002dformat=json']}}}};const tabs=[...root.querySelectorAll('[data-sa-example]')];const select=tab=\u003e{const example=examples[tab.dataset.saExample];tabs.forEach(item=\u003e{item.setAttribute('aria-selected',String(item===tab));item.tabIndex=item===tab?0:-1});root.querySelector('#sa-example').setAttribute('aria-labelledby',tab.id);root.querySelector('[data-sa-example-title]').textContent=example.title;root.querySelector('[data-sa-example-copy]').textContent=example.copy;root.querySelector('[data-sa-example-access]').textContent=example.access;root.querySelector('[data-sa-example-limit]').textContent=example.limit;root.querySelector('[data-sa-example-code]').textContent=JSON.stringify(example.call,null,2);root.querySelector('[data-sa-copy-status]').textContent=''};tabs.forEach((tab,index)=\u003e{tab.addEventListener('click',()=\u003eselect(tab));tab.addEventListener('keydown',event=\u003e{let next=index;if(event.key==='ArrowRight')next=(index+1)%tabs.length;else if(event.key==='ArrowLeft')next=(index+tabs.length-1)%tabs.length;else if(event.key==='Home')next=0;else if(event.key==='End')next=tabs.length-1;else return;event.preventDefault();select(tabs[next]);tabs[next].focus()})});const copy=root.querySelector('[data-sa-copy]');copy?.addEventListener('click',async()=\u003e{const status=root.querySelector('[data-sa-copy-status]');try{await navigator.clipboard.writeText(root.querySelector('[data-sa-example-code]').textContent);status.textContent='Copied'}catch{status.textContent='Select the example to copy it.'}});if(!matchMedia('(prefers-reduced-motion: reduce)').matches\u0026\u0026'IntersectionObserver'in window){const targets=root.querySelectorAll('.sa-section-grid,.sa-tool-index,.sa-boundary-grid,.sa-steps,.sa-offer-grid');targets.forEach(target=\u003etarget.classList.add('sa-reveal'));root.classList.add('sa-motion-ready');const observer=new IntersectionObserver(entries=\u003eentries.forEach(entry=\u003e{if(entry.isIntersecting){entry.target.classList.add('sa-visible');observer.unobserve(entry.target)}}),{threshold:.08});targets.forEach(target=\u003eobserver.observe(target))}})();\n","jsLocation":"footer","format":false,"phpExec":false,"output":"inline"} /-->

<!-- wp:gt-page-block/page-block {"name":"Access Boundaries","blockId":0,"blockSlug":"","content":"\u003csection class=\u0022sa-boundaries\u0022 aria-labelledby=\u0022sa-boundaries-title\u0022\u003e\n  \u003cdiv class=\u0022sa-wrap sa-boundary-grid\u0022\u003e\n    \u003cdiv\u003e\u003ch2 id=\u0022sa-boundaries-title\u0022\u003eChoose Your Agent's Access\u003c/h2\u003e\u003cp class=\u0022sa-section-lead\u0022\u003eEvery tool call checks the WordPress user's permissions and the access groups you've enabled.\u003c/p\u003e\u003cp\u003eYou can stop the connection by disabling Site Agent or revoking its dedicated Application Password. These controls remain in your WordPress admin.\u003c/p\u003e\u003ca class=\u0022sa-text-link\u0022 href=\u0022https://github.com/wpgaurav/site-agent#security-and-access\u0022 target=\u0022_blank\u0022 rel=\u0022noopener nofollow\u0022\u003eRead the Access Model \u003cspan aria-hidden=\u0022true\u0022\u003e\u003csvg xmlns=\u0022http://www.w3.org/2000/svg\u0022 width=\u002224\u0022 height=\u002224\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022 class=\u0022sa-icon\u0022 aria-hidden=\u0022true\u0022 focusable=\u0022false\u0022 \u003e \u003cpath stroke=\u0022none\u0022 d=\u0022M0 0h24v24H0z\u0022 fill=\u0022none\u0022 /\u003e \u003cpath d=\u0022M17 7l-10 10\u0022 /\u003e \u003cpath d=\u0022M8 7l9 0l0 9\u0022 /\u003e \u003c/svg\u003e\u003c/span\u003e\u003c/a\u003e\u003c/div\u003e\n    \u003cdiv class=\u0022sa-permission-matrix\u0022\u003e\u003cdiv class=\u0022sa-matrix-head\u0022\u003e\u003cspan\u003e\u003csvg xmlns=\u0022http://www.w3.org/2000/svg\u0022 width=\u002224\u0022 height=\u002224\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022 class=\u0022sa-icon\u0022 aria-hidden=\u0022true\u0022 focusable=\u0022false\u0022 \u003e \u003cpath stroke=\u0022none\u0022 d=\u0022M0 0h24v24H0z\u0022 fill=\u0022none\u0022 /\u003e \u003cpath d=\u0022M12 3a12 12 0 0 0 8.5 3a12 12 0 0 1 -8.5 15a12 12 0 0 1 -8.5 -15a12 12 0 0 0 8.5 -3\u0022 /\u003e \u003cpath d=\u0022M11 11a1 1 0 1 0 2 0a1 1 0 1 0 -2 0\u0022 /\u003e \u003cpath d=\u0022M12 12l0 2.5\u0022 /\u003e \u003c/svg\u003e Entry point\u003c/span\u003e\u003cspan\u003eDefault\u003c/span\u003e\u003c/div\u003e\u003cdiv\u003e\u003cspan\u003eContent writes\u003c/span\u003e\u003cspan\u003eOff\u003c/span\u003e\u003c/div\u003e\u003cdiv\u003e\u003cspan\u003eSource inspection\u003c/span\u003e\u003cspan\u003eOff\u003c/span\u003e\u003c/div\u003e\u003cdiv\u003e\u003cspan\u003eSource editing\u003c/span\u003e\u003cspan\u003eOff\u003c/span\u003e\u003c/div\u003e\u003cdiv\u003e\u003cspan\u003ePHP execution\u003c/span\u003e\u003cspan\u003eOff\u003c/span\u003e\u003c/div\u003e\u003cdiv\u003e\u003cspan\u003eWP-CLI execution\u003c/span\u003e\u003cspan\u003eOff\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\u0022sa-matrix-note\u0022\u003eConnections are also off until enabled.\u003c/div\u003e\u003c/div\u003e\n  \u003c/div\u003e\n  \u003cdiv class=\u0022sa-wrap sa-privilege-note\u0022\u003e\u003ch3\u003eDeveloper Tools Need a Trusted Client\u003c/h3\u003e\u003cdiv\u003e\u003cp\u003eI recommend a development or staging site with a current backup. These tools have server privileges and aren't a sandbox:\u003c/p\u003e\u003cul\u003e\u003cli\u003ePHP can change the database and files.\u003c/li\u003e\u003cli\u003eSource edits can change executable code.\u003c/li\u003e\u003cli\u003eWP-CLI can change the WordPress installation.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\u003c/div\u003e\n\u003c/section\u003e","css":"","js":"","jsLocation":"footer","format":false,"phpExec":false,"output":"inline"} /-->

<!-- wp:gt-page-block/page-block {"name":"Connection Setup","blockId":0,"blockSlug":"","content":"\u003csection class=\u0022sa-setup\u0022 id=\u0022sa-setup\u0022 aria-labelledby=\u0022sa-setup-title\u0022\u003e\n  \u003cdiv class=\u0022sa-wrap sa-section-grid\u0022\u003e\u003cdiv\u003e\u003ch2 id=\u0022sa-setup-title\u0022\u003eConnect Your WordPress Site\u003c/h2\u003e\u003cp class=\u0022sa-section-lead\u0022\u003eYour MCP client needs Streamable HTTP and a custom Authorization header. Site Agent uses WordPress Application Passwords for authentication.\u003c/p\u003e\u003c/div\u003e\u003cul class=\u0022sa-requirements\u0022\u003e\u003cli\u003eWordPress 6.9 or newer\u003c/li\u003e\u003cli\u003ePHP 8.0 or newer\u003c/li\u003e\u003cli\u003eHTTPS for remote connections\u003c/li\u003e\u003cli\u003eAdministrator access; super administrator on multisite\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\n  \u003cdiv class=\u0022sa-wrap sa-steps\u0022\u003e\u003cdiv\u003e\u003cspan\u003e1\u003c/span\u003e\u003ch3\u003eInstall the Plugin\u003c/h3\u003e\u003cp\u003eUpload the complete ZIP in WordPress. Open Tools → Site Agent.\u003c/p\u003e\u003c/div\u003e\u003cdiv\u003e\u003cspan\u003e2\u003c/span\u003e\u003ch3\u003eSelect the Tools\u003c/h3\u003e\u003cp\u003eEnable access and the groups your task needs. Save the settings.\u003c/p\u003e\u003c/div\u003e\u003cdiv\u003e\u003cspan\u003e3\u003c/span\u003e\u003ch3\u003eCreate a Password\u003c/h3\u003e\u003cp\u003eCreate a dedicated Application Password in your WordPress profile.\u003c/p\u003e\u003c/div\u003e\u003cdiv\u003e\u003cspan\u003e4\u003c/span\u003e\u003ch3\u003eConnect the Client\u003c/h3\u003e\u003cp\u003eUse the endpoint and authentication template shown in Site Agent.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\n  \u003cdiv class=\u0022sa-wrap sa-endpoint\u0022\u003e\u003cspan\u003e\u003csvg xmlns=\u0022http://www.w3.org/2000/svg\u0022 width=\u002224\u0022 height=\u002224\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022 class=\u0022sa-icon\u0022 aria-hidden=\u0022true\u0022 focusable=\u0022false\u0022 \u003e \u003cpath stroke=\u0022none\u0022 d=\u0022M0 0h24v24H0z\u0022 fill=\u0022none\u0022 /\u003e \u003cpath d=\u0022M7 12l5 5l-1.5 1.5a3.536 3.536 0 1 1 -5 -5l1.5 -1.5\u0022 /\u003e \u003cpath d=\u0022M17 12l-5 -5l1.5 -1.5a3.536 3.536 0 1 1 5 5l-1.5 1.5\u0022 /\u003e \u003cpath d=\u0022M3 21l2.5 -2.5\u0022 /\u003e \u003cpath d=\u0022M18.5 5.5l2.5 -2.5\u0022 /\u003e \u003cpath d=\u0022M10 11l-2 2\u0022 /\u003e \u003cpath d=\u0022M13 14l-2 2\u0022 /\u003e \u003c/svg\u003e Endpoint\u003c/span\u003e\u003ccode\u003ehttps://your-site.com/wp-json/site-agent/v1/mcp\u003c/code\u003e\u003cspan\u003eUse the exact URL shown on your site.\u003c/span\u003e\u003c/div\u003e\n\u003c/section\u003e","css":"","js":"","jsLocation":"footer","format":false,"phpExec":false,"output":"inline"} /-->

<!-- wp:gt-page-block/page-block {"name":"Questions","blockId":0,"blockSlug":"","content":"\u003csection class=\u0022sa-faq\u0022 aria-labelledby=\u0022sa-faq-title\u0022\u003e\n  \u003cdiv class=\u0022sa-wrap sa-section-grid\u0022\u003e\u003cdiv\u003e\u003ch2 id=\u0022sa-faq-title\u0022\u003eBefore You Connect\u003c/h2\u003e\u003cp class=\u0022sa-section-lead\u0022\u003eCheck the client, privacy and developer-access boundaries before enabling tools.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0022sa-questions\u0022\u003e\n    \u003cdetails\u003e\u003csummary\u003eWhich AI clients can connect?\u003cspan aria-hidden=\u0022true\u0022\u003e\u003csvg xmlns=\u0022http://www.w3.org/2000/svg\u0022 width=\u002224\u0022 height=\u002224\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022 class=\u0022sa-icon\u0022 aria-hidden=\u0022true\u0022 focusable=\u0022false\u0022 \u003e \u003cpath stroke=\u0022none\u0022 d=\u0022M0 0h24v24H0z\u0022 fill=\u0022none\u0022 /\u003e \u003cpath d=\u0022M12 5l0 14\u0022 /\u003e \u003cpath d=\u0022M5 12l14 0\u0022 /\u003e \u003c/svg\u003e\u003c/span\u003e\u003c/summary\u003e\u003cp\u003eUse a client with Streamable HTTP and custom Authorization headers, or a compatible Application Password bridge. Site Agent doesn't include OAuth. Clients that require an OAuth-only connection need a bridge.\u003c/p\u003e\u003c/details\u003e\n    \u003cdetails\u003e\u003csummary\u003eWhere does my site's data go?\u003cspan aria-hidden=\u0022true\u0022\u003e\u003csvg xmlns=\u0022http://www.w3.org/2000/svg\u0022 width=\u002224\u0022 height=\u002224\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022 class=\u0022sa-icon\u0022 aria-hidden=\u0022true\u0022 focusable=\u0022false\u0022 \u003e \u003cpath stroke=\u0022none\u0022 d=\u0022M0 0h24v24H0z\u0022 fill=\u0022none\u0022 /\u003e \u003cpath d=\u0022M12 5l0 14\u0022 /\u003e \u003cpath d=\u0022M5 12l14 0\u0022 /\u003e \u003c/svg\u003e\u003c/span\u003e\u003c/summary\u003e\u003cp\u003eYour MCP client connects directly to WordPress. Site Agent has no hosted MCP proxy or telemetry. The client or AI provider handles tool results under its own privacy policy.\u003c/p\u003e\u003cp\u003eAutomatic updates contact gauravtiwari.org with your license credentials, site URL and version information. PHP and WP-CLI can also make outbound requests when instructed.\u003c/p\u003e\u003c/details\u003e\n    \u003cdetails\u003e\u003csummary\u003eCan I use developer tools on production?\u003cspan aria-hidden=\u0022true\u0022\u003e\u003csvg xmlns=\u0022http://www.w3.org/2000/svg\u0022 width=\u002224\u0022 height=\u002224\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022 class=\u0022sa-icon\u0022 aria-hidden=\u0022true\u0022 focusable=\u0022false\u0022 \u003e \u003cpath stroke=\u0022none\u0022 d=\u0022M0 0h24v24H0z\u0022 fill=\u0022none\u0022 /\u003e \u003cpath d=\u0022M12 5l0 14\u0022 /\u003e \u003cpath d=\u0022M5 12l14 0\u0022 /\u003e \u003c/svg\u003e\u003c/span\u003e\u003c/summary\u003e\u003cp\u003eUse a backed-up development or staging site for PHP execution, file editing and WP-CLI. These tools run with server privileges and can break a site. Syntax checks and access switches don't contain arbitrary code or replace backups.\u003c/p\u003e\u003c/details\u003e\n    \u003cdetails\u003e\u003csummary\u003eWhat can the file tools reach?\u003cspan aria-hidden=\u0022true\u0022\u003e\u003csvg xmlns=\u0022http://www.w3.org/2000/svg\u0022 width=\u002224\u0022 height=\u002224\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022 class=\u0022sa-icon\u0022 aria-hidden=\u0022true\u0022 focusable=\u0022false\u0022 \u003e \u003cpath stroke=\u0022none\u0022 d=\u0022M0 0h24v24H0z\u0022 fill=\u0022none\u0022 /\u003e \u003cpath d=\u0022M12 5l0 14\u0022 /\u003e \u003cpath d=\u0022M5 12l14 0\u0022 /\u003e \u003c/svg\u003e\u003c/span\u003e\u003c/summary\u003e\u003cp\u003eFile tools are limited to theme and plugin directories. Hidden, configuration, credential and symlink paths are blocked. Source files can still contain sensitive data. Writes require the current file hash, or an explicit new-file value, and PHP syntax is checked before a write.\u003c/p\u003e\u003c/details\u003e\n    \u003cdetails\u003e\u003csummary\u003eHow do automatic updates work?\u003cspan aria-hidden=\u0022true\u0022\u003e\u003csvg xmlns=\u0022http://www.w3.org/2000/svg\u0022 width=\u002224\u0022 height=\u002224\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022 class=\u0022sa-icon\u0022 aria-hidden=\u0022true\u0022 focusable=\u0022false\u0022 \u003e \u003cpath stroke=\u0022none\u0022 d=\u0022M0 0h24v24H0z\u0022 fill=\u0022none\u0022 /\u003e \u003cpath d=\u0022M12 5l0 14\u0022 /\u003e \u003cpath d=\u0022M5 12l14 0\u0022 /\u003e \u003c/svg\u003e\u003c/span\u003e\u003c/summary\u003e\u003cp\u003eComplete the free checkout, then activate the license in Site Agent. FluentCart supplies update metadata and the protected download. The license affects automatic updates only. You can also install a complete release ZIP manually.\u003c/p\u003e\u003c/details\u003e\n    \u003cdetails\u003e\u003csummary\u003eWhat isn't included?\u003cspan aria-hidden=\u0022true\u0022\u003e\u003csvg xmlns=\u0022http://www.w3.org/2000/svg\u0022 width=\u002224\u0022 height=\u002224\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022 class=\u0022sa-icon\u0022 aria-hidden=\u0022true\u0022 focusable=\u0022false\u0022 \u003e \u003cpath stroke=\u0022none\u0022 d=\u0022M0 0h24v24H0z\u0022 fill=\u0022none\u0022 /\u003e \u003cpath d=\u0022M12 5l0 14\u0022 /\u003e \u003cpath d=\u0022M5 12l14 0\u0022 /\u003e \u003c/svg\u003e\u003c/span\u003e\u003c/summary\u003e\u003cp\u003eThis version doesn't include OAuth, an AI chat interface, background WP-CLI jobs or a recoverable PHP sandbox. The bundled official MCP Adapter is a pinned 0.7.0 prerelease. PHP runs in the WordPress request and isn't isolated from the site.\u003c/p\u003e\u003c/details\u003e\n  \u003c/div\u003e\u003c/div\u003e\n\u003c/section\u003e","css":"","js":"","jsLocation":"footer","format":false,"phpExec":false,"output":"inline"} /-->
