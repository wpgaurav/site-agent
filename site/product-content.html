<!-- wp:gt-page-block/page-block {"name":"Hero","blockId":0,"blockSlug":"","content":"\u003csection class=\u0022sa-hero\u0022 aria-labelledby=\u0022sa-title\u0022\u003e\n  \u003cdiv class=\u0022sa-wrap sa-hero-inner\u0022\u003e\n    \u003ch1 id=\u0022sa-title\u0022\u003eSite Agent \u003cimg src=\u0022https://r2.gauravtiwari.org/wp-content/uploads/2026/09/site-agent-icon-approved-512.png\u0022 alt=\u0022\u0022 width=\u002272\u0022 height=\u002272\u0022\u003e\u003cbr\u003eWordPress MCP Tools.\u003c/h1\u003e\n    \u003cp class=\u0022sa-lead\u0022\u003eAn AI agent that can't see your WordPress site works from guesses and pasted snippets. Site Agent is my free plugin that connects your AI client to the site itself, so the agent reads the real content and code before it changes anything.\u003c/p\u003e\n    \u003cdiv class=\u0022sa-actions\u0022\u003e\u003ca class=\u0022sa-button sa-button-primary\u0022 href=\u0022https://gauravtiwari.org/?fluent-cart=instant_checkout\u0026item_id=131\u0026quantity=1\u0022 data-sa-cta=\u0022hero\u0022\u003eGet Site Agent \u003cspan aria-hidden=\u0022true\u0022\u003e\u003csvg xmlns=\u0022http://www.w3.org/2000/svg\u0022 width=\u002224\u0022 height=\u002224\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022 class=\u0022sa-icon\u0022 aria-hidden=\u0022true\u0022 focusable=\u0022false\u0022\u003e\u003cpath d=\u0022M17 7l-10 10\u0022/\u003e\u003cpath d=\u0022M8 7l9 0l0 9\u0022/\u003e\u003c/svg\u003e\u003c/span\u003e\u003c/a\u003e\u003ca class=\u0022sa-button sa-button-ghost\u0022 href=\u0022#sa-connect\u0022\u003eConnect Your Client \u003cspan aria-hidden=\u0022true\u0022\u003e\u003csvg xmlns=\u0022http://www.w3.org/2000/svg\u0022 width=\u002224\u0022 height=\u002224\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 <!-- wp:gt-page-block/page-block {"name":"Tool Index","blockId":0,"blockSlug":"","content":"\u003csection class=\u0022sa-tools-section\u0022 id=\u0022sa-tools\u0022 aria-labelledby=\u0022sa-tools-title\u0022\u003e\n  \u003cdiv class=\u0022sa-wrap\u0022\u003e\n    \u003cdiv class=\u0022sa-head sa-head\u002d\u002dsplit\u0022\u003e\u003ch2 id=\u0022sa-tools-title\u0022\u003eWordPress MCP Tools\u003c/h2\u003e\u003cp\u003eSite Agent gives your agent 18 tools, and on Bricks sites it can add Bricks' own abilities too. The read tools work as soon as Site Agent is enabled. Every tool that changes something sits behind its own switch in Tools \u0026gt; Site Agent.\u003c/p\u003e\u003c/div\u003e\n    \u003cdiv class=\u0022sa-groups\u0022\u003e\n      \u003cdiv class=\u0022sa-group\u0022\u003e\n        \u003cdiv class=\u0022sa-group-head\u0022\u003e\u003cspan class=\u0022sa-tile\u0022 aria-hidden=\u0022true\u0022\u003e\u003csvg xmlns=\u0022http://www.w3.org/2000/svg\u0022 width=\u002224\u0022 height=\u002224\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022 class=\u0022sa-icon\u0022 aria-hidden=\u0022true\u0022 focusable=\u0022false\u0022\u003e\u003cpath d=\u0022M4 6a8 3 0 1 0 16 0a8 3 0 1 0 -16 0\u0022/\u003e\u003cpath d=\u0022M4 6v6a8 3 0 0 0 16 0v-6\u0022/\u003e\u003cpath d=\u0022M4 12v6a8 3 0 0 0 16 0v-6\u0022/\u003e\u003c/svg\u003e\u003c/span\u003e\u003ch3\u003eRead the Site\u003c/h3\u003e\u003cspan class=\u0022sa-switch sa-switch\u002d\u002don\u0022\u003eOn with Site Agent\u003c/span\u003e\u003c/div\u003e\n        \u003cdl class=\u0022sa-tools\u0022\u003e\n          \u003cdiv\u003e\u003cdt\u003eSite context \u003ccode\u003esite-context\u003c/code\u003e\u003c/dt\u003e\u003cdd\u003eWordPress, PHP, theme, plugins, page builders, post types and the tools this connection can use.\u003c/dd\u003e\u003c/div\u003e\n          \u003cdiv\u003e\u003cdt\u003eList content \u003ccode\u003elist-content\u003c/code\u003e\u003c/dt\u003e\u003cdd\u003eSearch posts and pages, with the latest edits first.\u003c/dd\u003e\u003c/div\u003e\n          \u003cdiv\u003e\u003cdt\u003eRead content \u003ccode\u003eget-content\u003c/code\u003e\u003c/dt\u003e\u003cdd\u003eBlock markup, terms, featured image, SEO fields and the builder that stores the layout, by ID, URL or slug.\u003c/dd\u003e\u003c/div\u003e\n          \u003cdiv\u003e\u003cdt\u003eList terms \u003ccode\u003elist-terms\u003c/code\u003e\u003c/dt\u003e\u003cdd\u003eCategories, tags and other terms with their IDs.\u003c/dd\u003e\u003c/div\u003e\n          \u003cdiv\u003e\u003cdt\u003eList media \u003ccode\u003elist-media\u003c/code\u003e\u003c/dt\u003e\u003cdd\u003eLibrary items with URLs, dimensions and alt text.\u003c/dd\u003e\u003c/div\u003e\n          \u003cdiv\u003e\u003cdt\u003eList skills \u003ccode\u003elist-skills\u003c/code\u003e\u003c/dt\u003e\u003cdd\u003eThe builder skills that ship with the plugin, and which builders this site runs.\u003c/dd\u003e\u003c/div\u003e\n          \u003cdiv\u003e\u003cdt\u003eRead skill \u003ccode\u003eget-skill\u003c/code\u003e\u003c/dt\u003e\u003cdd\u003eA builder's workflow and reference files, read before the agent writes.\u003c/dd\u003e\u003c/div\u003e\n        \u003c/dl\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\u0022sa-group\u0022\u003e\n        \u003cdiv class=\u0022sa-group-head\u0022\u003e\u003cspan class=\u0022sa-tile\u0022 aria-hidden=\u0022true\u0022\u003e\u003csvg xmlns=\u0022http://www.w3.org/2000/svg\u0022 width=\u002224\u0022 height=\u002224\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022 class=\u0022sa-icon\u0022 aria-hidden=\u0022true\u0022 focusable=\u0022false\u0022\u003e\u003cpath d=\u0022M4 20h4l10.5 -10.5a2.828 2.828 0 1 0 -4 -4l-10.5 10.5v4\u0022/\u003e\u003cpath d=\ dt\u003e\u003cdd\u003eBrowse plugins, themes and must-use plugins.\u003c/dd\u003e\u003c/div\u003e\n          \u003cdiv\u003e\u003cdt\u003eRead file \u003ccode\u003eread-file\u003c/code\u003e\u003c/dt\u003e\u003cdd\u003eSource code with the hash needed to change it.\u003c/dd\u003e\u003c/div\u003e\n        \u003c/dl\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\u0022sa-group\u0022\u003e\n        \u003cdiv class=\u0022sa-group-head\u0022\u003e\u003cspan class=\u0022sa-tile\u0022 aria-hidden=\u0022true\u0022\u003e\u003csvg xmlns=\u0022http://www.w3.org/2000/svg\u0022 width=\u002224\u0022 height=\u002224\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022 class=\u0022sa-icon\u0022 aria-hidden=\u0022true\u0022 focusable=\u0022false\u0022\u003e\u003cpath d=\u0022M14 3v4a1 1 0 0 0 1 1h4\u0022/\u003e\u003cpath d=\u0022M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2\u0022/\u003e\u003cpath d=\u0022M10 13l-1 2l1 2\u0022/\u003e\u003cpath d=\u0022M14 13l1 2l-1 2\u0022/\u003e\u003c/svg\u003e\u003c/span\u003e\u003ch3\u003eEdit Source\u003c/h3\u003e\u003cspan class=\u0022sa-switch\u0022\u003eSource editing\u003c/span\u003e\u003c/div\u003e\n        \u003cdl class=\u0022sa-tools\u0022\u003e\n          \u003cdiv\u003e\u003cdt\u003eWrite file \u003ccode\u003ewrite-file\u003c/code\u003e\u003c/dt\u003e\u003cdd\u003eCreate or replace a file. A PHP change that breaks the site is reverted.\u003c/dd\u003e\u003c/div\u003e\n          \u003cdiv\u003e\u003cdt\u003eCreate directory \u003ccode\u003ecreate-directory\u003c/code\u003e\u003c/dt\u003e\u003cdd\u003eStart a new plugin or theme folder.\u003c/dd\u003e\u003c/div\u003e\n          \u003cdiv\u003e\u003cdt\u003eMove file \u003ccode\u003emove-file\u003c/code\u003e\u003c/dt\u003e\u003cdd\u003eRename or move a file that still matches its hash.\u003c/dd\u003e\u003c/div\u003e\n          \u003cdiv\u003e\u003cdt\u003eDelete file \u003ccode\u003edelete-file\u003c/code\u003e\u003c/dt\u003e\u003cdd\u003eRemove a file or an empty folder, with the same checks.\u003c/dd\u003e\u003c/div\u003e\n        \u003c/dl\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\u0022sa-group\u0022\u003e\n        \u003cdiv class=\u0022sa-group-head\u0022\u003e\u003cspan class=\u0022sa-tile\u0022 aria-hidden=\u0022true\u0022\u003e\u003csvg xmlns=\u0022http://www.w3.org/2000/svg\u0022 width=\u002224\u0022 height=\u002224\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022 class=\u0022sa-icon\u0022 aria-hidden=\u0022true\u0022 focusable=\u0022false\u0022\u003e\u003cpath d=\u0022M8 9l3 3l-3 3\u0022/\u003e\u003cpath d=\u0022M13 15l3 0\u0022/\u003e\u003cpath d=\u0022M3 6a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2l0 -12\u0022/\u003e\u003c/svg\u003e\u003c/span\u003e\u003ch3\u003eRun Code\u003c/h3\u003e\u003cspan class=\u0022sa-switch\u0022\u003ePHP and WP-CLI\u003c/span\u003e\u003c/div\u003e\n        \u003cdl class=\u0022sa-tools\u0022\u003e\n          \u003cdiv\u003e\u003cdt\u003eExecute PHP \u003ccode\u003eexecute-php\u003c/code\u003e\u003c/dt\u003e\u003cdd\u003eRun PHP with WordPress loaded and get the output and return value.\u003c/dd\u003e\u003c/div\u003e\n          \u003cdiv\u003e\u003cdt\u003eRun WP-CLI \u003ccode\u003erun-wp-cli\u003c/code\u003e\u003c/dt\u003e\u003cdd\u003eForeground commands as the signed-in user, without a shell.\u003c/dd\u003e\u003c/div\u003e\n        \u003c/dl\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\u0022sa-group\u0022\u003e\n        \u003cdiv class=\u0022sa-group-head\u0022\u003e\u003cspan class=\u0022sa-tile\u0022 aria-hidden=\u0022true\u0022\u003e\u003csvg xmlns=\u0022http://www.w3.org/2000/svg\u0022 width=\u002224\u0022 height=\u002224\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022 class=\u0022sa-icon\u0022 aria-hidden=\u0022true\u0022 focusable=\u0022false\u0022\u003e\u003cpath d=\u0022M7 8l-4 4l4 4\u0022/\u003e\u003cpath d=\u0022M17 8l4 4l-4 4\u0022/\u003e\u003cpath d=\u0022M14 4l-4 16\u0022/\u003e\u003c/svg\u003e\u003c/span\u003e\u003ch3\u003eBricks Builder\u003c/h3\u003e\u003cspan class=\u0022sa-switch\u0022\u003eBricks tools\u003c/span\u003e\u003c/div\u003e\n        \u003cdl class=\u0022sa-tools\u0022\u003e\n          \u003cdiv\u003e\u003cdt\u003eBricks fast path \u003ccode\u003ebricks-*\u003c/code\u003e\u003c/dt\u003e\u003cdd\u003eBricks' own tools for page edits, imports and design context, under their own names.\u003c/dd\u003e\u003c/div\u003e\n          \u003cdiv\u003e\u003cdt\u003eList Bricks abilities \u003ccode\u003ebricks-abilities\u003c/code\u003e\u003c/dt\u003e\u003cdd\u003eEvery other ability Bricks offers on this site, with its schema on request.\u003c/dd\u003e\u003c/div\u003e\n          \u003cdiv\u003e\u003cdt\u003eRun Bricks ability \u003ccode\u003erun-bricks-ability\u003c/code\u003e\u003c/dt\u003e\u003cdd\u003eRun any of them, with Bricks' own permission and input checks.\u003c/dd\u003e\u003c/div\u003e\n        \u003c/dl\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\u003c/section\u003e","css":"","js":"","jsLocation":"footer","format":false,"phpExec":false,"output":"inline"} /-->

<!-- wp:gt-page-block/page-block {"name":"Page Builders","blockId":0,"blockSlug":"","content":"\u003csection class=\u0022sa-builders\u0022 id=\u0022sa-builders\u0022 aria-labelledby=\u0022sa-builders-title\u0022\u003e\n  \u003cdiv class=\u0022sa-wrap\u0022\u003e\n    \u003cdiv class=\u0022sa-head sa-head\u002d\u002dsplit\u0022\u003e\u003ch2 id=\u0022sa-builders-title\u0022\u003eWorks With Your Page Builder\u003c/h2\u003e\u003cp\u003eAn agent that writes block markup into an Elementor or Bricks page changes nothing visitors see, because the real layout lives somewhere else. Site Agent tells the agent where each layout lives and how that builder expects it to be changed.\u003c/p\u003e\u003c/div\u003e\n    \u003cdiv class=\u0022sa-matrix sa-builders-matrix\u0022\u003e\n      \u003ctable\u003e\n        \u003ccaption class=\u0022screen-reader-text\u0022\u003ePage builders, where each one stores its layouts and how the agent changes them\u003c/caption\u003e\n        \u003cthead\u003e\u003ctr\u003e\u003cth scope=\u0022col\u0022\u003eBuilder\u003c/th\u003e\u003cth scope=\u0022col\u0022\u003eLayout lives in\u003c/th\u003e\u003cth scope=\u0022col\u0022\u003eHow the agent changes it\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\n        \u003ctbody\u003e\n          \u003ctr\u003e\u003cth scope=\u0022row\u0022\u003eGutenberg\u003c/th\u003e\u003ctd\u003eBlock markup in the post\u003c/td\u003e\u003ctd\u003eContent writes, then a byte-exact read-back\u003c/td\u003e\u003c/tr\u003e\n          \u003ctr\u003e\u003cth scope=\u0022row\u0022\u003eGenerateBlocks\u003c/th\u003e\u003ctd\u003eBlock markup with its own CSS\u003c/td\u003e\u003ctd\u003eContent writes, after a serializer check\u003c/td\u003e\u003c/tr\u003e\n          \u003ctr\u003e\u003cth scope=\u0022row\u0022\u003eElementor\u003c/th\u003e\u003ctd\u003eJSON in post meta\u003c/td\u003e\u003ctd\u003eElementor's own save, sent as small patches\u003c/td\u003e\u003c/tr\u003e\n          \u003ctr\u003e\u003cth scope=\u0022row\u0022\u003eBricks\u003c/th\u003e\u003ctd\u003eElement arrays in post meta\u003c/td\u003e\u003ctd\u003eBricks' own abilities on Bricks 2.4 and later\u003c/td\u003e\u003c/tr\u003e\n          \u003ctr\u003e\u003cth scope=\u0022row\u0022\u003eDivi\u003c/th\u003e\u003ctd\u003eShortcodes or Divi 5 blocks in the post\u003c/td\u003e\u003ctd\u003eContent writes, or exact fragment edits\u003c/td\u003e\u003c/tr\u003e\n        \u003c/tbody\u003e\n      \u003c/table\u003e\n    \u003c/div\u003e\n    \u003cdiv class=\u0022sa-cards\u0022\u003e\n      \u003carticle class=\u0022sa-card\u0022\u003e\u003cspan class=\u0022sa-tile\u0022 aria-hidden=\u0022true\u0022\u003e\u003csvg xmlns=\u0022http://www.w3.org/2000/svg\u0022 width=\u002224\u0022 height=\u002224\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022 class=\u0022sa-icon\u0022 aria-hidden=\u0022true\u0022 focusable=\u0022false\u0022\u003e\u003cpath d=\u0022M14 3v4a1 1 0 0 0 1 1h4\u0022/\u003e\u003cpath d=\u0022M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2\u0022/\u003e\u003cpath d=\u0022M10 13l-1 2l1 2\u0022/\u003e\u003cpath d=\u0022M14 13l1 2l-1 2\u0022/\u003e\u003c/svg\u003e\u003c/span\u003e\u003ch3\u003eA Skill for Each Builder\u003c/h3\u003e\u003cp\u003eFive builder skills ship with the plugin. The agent reads the matching one before it writes, so it follows that builder's storage and escaping rules instead of guessing.\u003c/p\u003e\u003c/article\u003e\n      \u003carticle class=\u0022sa-card\u0022\u003e\u003cspan class=\u0022sa-tile\u0022 aria-hidden=\u0022true\u0022\u003e\u003csvg xmlns=\u0022http://www.w3.org/2000/svg\u0022 width=\u002224\u0022 height=\u002224\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022 class=\u0022sa-icon\u0022 aria-hidden=\u0022true\u0022 focusable=\u0022false\u0022\u003e\u003cpath d=\u0022M5 13a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-6z\u0022/\u003e\u003cpath d=\u0022M11 16a1 1 0 1 0 2 0a1 1 0 0 0 -2 0\u0022/\u003e\u003cpath d=\u0022M8 11v-4a4 4 0 1 1 8 0v4\u0022/\u003e\u003c/svg\u003e\u003c/span\u003e\u003ch3\u003eLayout Data Stays Intact\u003c/h3\u003e\u003cp\u003eContent writes refuse raw Elementor, Bricks and Divi layout data. Writing it directly skips the builder's validation and leaves stale CSS behind, so the skills use each builder's own save.\u003c/p\u003e\u003c/article\u003e\n      \u003carticle class=\u0022sa-card\u0022\u003e\u003cspan class=\u0022sa-tile\u0022 aria-hidden=\u0022true\u0022\u003e\u003csvg xmlns=\u0022http://www.w3.org/2000/svg\u0022 width=\u002224\u0022 height=\u002224\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022 class=\u0022sa-icon\u0022 aria-hidden=\u0022true\u0022 focusable=\u0022false\u0022\u003e\u003cpath d=\u0022M7 8l-4 4l4 4\u0022/\u003e\u003cpath d=\u0022M17 8l4 4l-4 4\u0022/\u003e\u003cpath d=\u0022M14 4l-4 16\u0022/\u003e\u003c/svg\u003e\u003c/span\u003e\u003ch3\u003eBricks on the Same Connection\u003c/h3\u003e\u003cp\u003eOn Bricks 2.4 and later, switch on Bricks tools and your agent gets Bricks' own abilities next to Site Agent's: page summaries, revisions and CSS regeneration, with Bricks' permissions still in charge.\u003c/p\u003e\u003c/article\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\u003c/section\u003e","css":"","js":"","jsLocation":"footer","format":false,"phpExec":false,"output":"inline"} /-->

<!-- wp:gt-page-block/page-block {"name":"Safety Checks","blockId":0,"blockSlug":"","content":"\u003csection class=\u0022sa-safety sa-alt\u0022 aria-labelledby=\u0022sa-safety-title\u0022\u003e\n  \u003cdiv class=\u0022sa-wrap\u0022\u003e\n    \u003cdiv class=\u0022sa-head sa-head\u002d\u002dcenter\u0022\u003e\u003ch2 id=\u0022sa-safety-title\u0022\u003eSafety Checks on Every Change\u003c/h2\u003e\u003cp\u003eAn agent with write access will get something wrong sooner or later. I built Site Agent so the common mistakes are caught, or easy to undo, before your visitors see them.\u003c/p\u003e\u003c/div\u003e\n    \u003cdiv class=\u0022sa-cards\u0022\u003e\n      \u003carticle class=\u0022sa-card\u0022\u003e\u003cspan class=\u0022sa-tile\u0022 aria-hidden=\u0022true\u0022\u003e\u003csvg xmlns=\u0022http://www.w3.org/2000/svg\u0022 width=\u002224\u0022 height=\u002224\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022 class=\u0022sa-icon\u0022 aria-hidden=\u0022true\u0022 focusable=\u0022false\u0022\u003e\u003cpath d=\u0022M11.46 20.846a12 12 0 0 1 -7.96 -14.846a12 12 0 0 0 8.5 -3a12 12 0 0 0 8.5 3a12 12 0 0 1 -.09 7.06\u0022/\u003e\u003cpath d=\u0022M15 19l2 2l4 -4\u0022/\u003e\u003c/svg\u003e\u003c/span\u003e\u003ch3\u003eLive Posts Stay Live\u003c/h3\u003e\u003cp\u003eWhen the agent edits a published post, the change is saved as an autosave you review in the editor, and the agent can read it back to check it. The live post changes only when the agent passes a status.\u003c/p\u003e\u003c/article\u003e\n      \u003carticle class=\u0022sa-card\u0022\u003e\u003cspan class=\u0022sa-tile\u0022 aria-hidden=\u0022true\u0022\u003e\u003csvg xmlns=\u0022http://www.w3.org/2000/svg\u0022 width=\u002224\u0022 height=\u002224\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022 class=\u0022sa-icon\u0022 aria-hidden=\u0022true\u0022 focusable=\u0022false\u0022\u003e\u003cpath d=\u0022M9 14l-4 -4l4 -4\u0022/\u003e\u003cpath d=\u0022M5 10h11a4 4 0 1 1 0 8h-1\u0022/\u003e\u003c/svg\u003e\u003c/span\u003e\u003ch3\u003eBroken PHP Gets Reverted\u003c/h3\u003e\u003cp\u003ePHP is checked for syntax and compile errors first. After saving, Site Agent loads your site and puts the old file back if the change causes a fatal error.\u003c/p\u003e\u003c/article\u003e\n      \u003carticle class=\u0022sa-card\u0022\u003e\u003cspan class=\u0022sa-tile\u0022 aria-hidden=\u0022true\u0022\u003e\u003csvg xmlns=\u0022http://www.w3.org/2000/svg\u0022 width=\u002224\u0022 height=\u002224\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022 class=\u0022sa-icon\u0022 aria-hidden=\u0022true\u0022 focusable=\u0022false\u0022\u003e\u003cpath d=\u0022M5 13a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-6z\u0022/\u003e\u003cpath d=\u0022M11 16a1 1 0 1 0 2 0a1 1 0 0 0 -2 0\u0022/\u003e\u003cpath d=\u0022M8 11v-4a4 4 0 1 1 8 0v4\u0022/\u003e\u003c/svg\u003e\u003c/span\u003e\u003ch3\u003eNo Silent Overwrites\u003c/h3\u003e\u003cp\u003eEvery update needs the hash from the agent's last read. If you or another tool changed the post or file since then, the write is refused.\u003c/p\u003e\u003c/article\u003e\n      \u003carticle class=\u0022sa-card\u0022\u003e\u003cspan class=\u0022sa-tile\u0022 aria-hidden=\u0022true\u0022\u003e\u003csvg xmlns=\u0022http://www.w3.org/2000/svg\u0022 width=\u002224\u0022 height=\u002224\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022 class=\u0022sa-icon\u0022 aria-hidden=\u0022true\u0022 focusable=\u0022false\u0022\u003e\u003cpath d=\u0022M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0\u0022/\u003e\u003cpath d=\u0022M12 8v4\u0022/\u003e\u003cpath d=\u0022M12 16h.01\u0022/\u003e\u003c/svg\u003e\u003c/span\u003e\u003ch3\u003eErrors the Agent Can Fix\u003c/h3\u003e\u003cp\u003eFailed PHP and tool calls return the real message and line number, so the agent can correct its own code instead of guessing.\u003c/p\u003e\u003c/article\u003e\n      \u003carticle class=\u0022sa-card\u0022\u003e\u003cspan class=\u0022sa-tile\u0022 aria-hidden=\u0022true\u0022\u003e\u003csvg xmlns=\u0022http://www.w3.org/2000/svg\u0022 width=\u002224\u0022 height=\u002224\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022 class=\u0022sa-icon\u0022 aria-hidden=\u0022true\u0022 focusable=\u0022false\u0022\u003e\u003cpath d=\u0022M16.555 3.843l3.602 3.602a2.877 2.877 0 0 1 0 4.069l-2.643 2.643a2.877 2.877 0 0 1 -4.069 0l-.301 -.301l-6.558 6.558a2 2 0 0 1 -1.239 .578l-.175 .008h-1.172a1 1 0 0 1 -.993 -.883l-.007 -.117v-1.172a2 2 0 0 1 .467 -1.284l.119 -.13l.414 -.414h2v-2h2v-2l2.144 -2.144l-.301 -.301a2.877 2.877 0 0 1 0 -4.069l2.643 -2.643a2.877 2.877 0 0 1 4.069 0z\u0022/\u003e\u003cpath d=\u0022M15 9h.01\u0022/\u003e\u003c/svg\u003e\u003c/span\u003e\u003ch3\u003eLimits per Password\u003c/h3\u003e\u003cp\u003eEach Application Password can be limited to the tools it needs, such as content writes for a chat app and developer tools for your local coding agent.\u003c/p\u003e\u003c/article\u003e\n      \u003carticle class=\u0022sa-card\u0022\u003e\u003cspan class=\u0022sa-tile\u0022 aria-hidden=\u0022true\u0022\u003e\u003csvg xmlns=\u0022http://www.w3.org/2000/svg\u0022 width=\u002224\u0022 height=\u002224\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022 class=\u0022sa-icon\u0022 aria-hidden=\u0022true\u0022 focusable=\u0022false\u0022\u003e\u003cpath d=\u0022M12 8l0 4l2 2\u0022/\u003e\u003cpath d=\u0022M3.05 11a9 9 0 1 1 .5 4m-.5 5v-5h5\u0022/\u003e\u003c/svg\u003e\u003c/span\u003e\u003ch3\u003eA Record of Every Call\u003c/h3\u003e\u003cp\u003eThe audit history keeps the last 100 calls with the tool, target, password name and result. It never stores content, code or credentials.\u003c/p\u003e\u003c/article\u003e\n    \u003c/div\u003e\n    \u003cfigure class=\u0022sa-shot\u0022\u003e\u003ca class=\u0022sa-shot-open\u0022 href=\u0022https://r2.gauravtiwari.org/wp-content/uploads/2026/10/site-agent-application-password-limits.png\u0022\u003e\u003cimg src=\u0022https://r2.gauravtiwari.org/wp-content/uploads/2026/10/site-agent-application-password-limits.png\u0022 alt=\u0022Site Agent Application Password access table where each password can be limited to content writes, source inspection, source editing, PHP execution or WP-CLI execution, with password names redacted\u0022 width=\u00222360\u0022 height=\u0022900\u0022 loading=\u0022lazy\u0022 decoding=\u0022async\u0022\u003e\u003c/a\u003e\u003cfigcaption\u003eTap the screenshot to open it at full size.\u003c/figcaption\u003e\u003c/figure\u003e\n  \u003c/div\u003e\n\u003c/section\u003e","css":"","js":"","jsLocation":"footer","format":false,"phpExec":false,"output":"inline"} /-->

<!-- wp:gt-page-block/page-block {"name":"Access Model","blockId":0,"blockSlug":"","content":"\u003csection class=\u0022sa-access\u0022 aria-labelledby=\u0022sa-access-title\u0022\u003e\n  \u003cdiv class=\u0022sa-wrap\u0022\u003e\n    \u003cdiv class=\u0022sa-access-grid\u0022\u003e\n      \u003cdiv class=\u0022sa-access-copy\u0022\u003e\n        \u003ch2 id=\u0022sa-access-title\u0022\u003eChoose Your Agent's Access\u003c/h2\u003e\n        \u003cp\u003eAccess starts switched off. You turn on Site Agent, pick the tool groups the task needs and save.\u003c/p\u003e\n        \u003cp\u003eEvery tool call then checks:\u003c/p\u003e\n        \u003cul class=\u0022sa-bullets\u0022\u003e\n          \u003cli\u003ean administrator account (a super administrator on multisite)\u003c/li\u003e\n          \u003cli\u003ethe switch for that tool group\u003c/li\u003e\n          \u003cli\u003ethe limit on the Application Password, if you set one\u003c/li\u003e\n        \u003c/ul\u003e\n        \u003cp\u003eRevoking the Application Password ends that connection everywhere, including sessions that are already open.\u003c/p\u003e\n        \u003ca class=\u0022sa-text-link\u0022 href=\u0022https://github.com/wpgaurav/site-agent#security-and-access\u0022 target=\u0022_blank\u0022 rel=\u0022noopener nofollow\u0022\u003eRead the Access Model \u003cspan aria-hidden=\u0022true\u0022\u003e\u003csvg xmlns=\u0022http://www.w3.org/2000/svg\u0022 width=\u002224\u0022 height=\u002224\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022 class=\u0022sa-icon\u0022 aria-hidden=\u0022true\u0022 focusable=\u0022false\u0022\u003e\u003cpath d=\u0022M17 7l-10 10\u0022/\u003e\u003cpath d=\u0022M8 7l9 0l0 9\u0022/\u003e\u003c/svg\u003e\u003c/span\u003e\u003c/a\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\u0022sa-matrix\u0022\u003e\n        \u003ctable\u003e\n          \u003ccaption class=\u0022screen-reader-text\u0022\u003eTool groups, their default state and the number of tools in each\u003c/caption\u003e\n          \u003cthead\u003e\u003ctr\u003e\u003cth scope=\u0022col\u0022\u003eTool group\u003c/th\u003e\u003cth scope=\u0022col\u0022\u003eDefault\u003c/th\u003e\u003cth scope=\u0022col\u0022\u003eTools\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\n          \u003ctbody\u003e\n            \u003ctr\u003e\u003cth scope=\u0022row\u0022\u003eRead the site\u003c/th\u003e\u003ctd\u003e\u003cspan class=\u0022sa-state sa-state\u002d\u002don\u0022\u003eOn\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e7\u003c/td\u003e\u003c/tr\u003e\n            \u003ctr\u003e\u003cth scope=\u0022row\u0022\u003eContent writes\u003c/th\u003e\u003ctd\u003e\u003cspan class=\u0022sa-state\u0022\u003eOff\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e3\u003c/td\u003e\u003c/tr\u003e\n            \u003ctr\u003e\u003cth scope=\u0022row\u0022\u003eSource inspection\u003c/th\u003e\u003ctd\u003e\u003cspan class=\u0022sa-state\u0022\u003eOff\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e2\u003c/td\u003e\u003c/tr\u003e\n            \u003ctr\u003e\u003cth scope=\u0022row\u0022\u003eSource editing\u003c/th\u003e\u003ctd\u003e\u003cspan class=\u0022sa-state\u0022\u003eOff\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e4\u003c/td\u003e\u003c/tr\u003e\n            \u003ctr\u003e\u003cth scope=\u0022row\u0022\u003ePHP execution\u003c/th\u003e\u003ctd\u003e\u003cspan class=\u0022sa-state\u0022\u003eOff\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e1\u003c/td\u003e\u003c/tr\u003e\n            \u003ctr\u003e\u003cth scope=\u0022row\u0022\u003eWP-CLI execution\u003c/th\u003e\u003ctd\u003e\u003cspan class=\u0022sa-state\u0022\u003eOff\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e1\u003c/td\u003e\u003c/tr\u003e\n            \u003ctr\u003e\u003cth scope=\u0022row\u0022\u003eBricks tools\u003c/th\u003e\u003ctd\u003e\u003cspan class=\u0022sa-state\u0022\u003eOff\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e2+\u003c/td\u003e\u003c/tr\u003e\n          \u003c/tbody\u003e\n        \u003c/table\u003e\n        \u003cdiv class=\u0022sa-constants\u0022\u003e\n          \u003cp\u003e\u003ccode\u003eSITE_AGENT_DISABLED\u003c/code\u003e in wp-config.php blocks every tool.\u003c/p\u003e\n          \u003cp\u003e\u003ccode\u003eSITE_AGENT_ALLOW_EXECUTION\u003c/code\u003e set to false blocks the tools that change code. Content tools and source inspection keep working.\u003c/p\u003e\n          \u003cp\u003e\u003ccode\u003eDISALLOW_FILE_EDIT\u003c/code\u003e blocks every source and developer tool.\u003c/p\u003e\n          \u003cp\u003eBricks tools need Bricks 2.4 or later with its AI/MCP abilities switched on, and add Bricks' own fast-path tools to the 2 listed.\u003c/p\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n    \u003cfigure class=\u0022sa-shot\u0022\u003e\u003ca class=\u0022sa-shot-open\u0022 href=\u0022https://r2.gauravtiwari.org/wp-content/uploads/2026/10/site-agent-tool-group-switches.png\u0022\u003e\u003cimg src=\u0022https://r2.gauravtiwari.org/wp-content/uploads/2026/10/site-agent-tool-group-switches.png\u0022 alt=\u0022Site Agent settings screen in WordPress with a separate switch for Site Agent, URL authentication, content writes, source inspection, source editing, PHP execution, WP-CLI execution and audit history\u0022 width=\u00222360\u0022 height=\u00221702\u0022 loading=\u0022lazy\u0022 decoding=\u0022async\u0022\u003e\u003c/a\u003e\u003cfigcaption\u003eTap the screenshot to open it at full size.\u003c/figcaption\u003e\u003c/figure\u003e\n    \u003cdiv class=\u0022sa-note\u0022\u003e\n      \u003ch3\u003eDeveloper Tools Need a Trusted Client\u003c/h3\u003e\n      \u003cdiv\u003e\u003cp\u003eI recommend a staging site with a current backup for the developer tools. They run with server privileges and aren't a sandbox:\u003c/p\u003e\u003cul class=\u0022sa-bullets\u0022\u003e\u003cli\u003ePHP can change the database and files.\u003c/li\u003e\u003cli\u003eSource edits change executable code.\u003c/li\u003e\u003cli\u003eWP-CLI can change the WordPress installation.\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\u003c/section\u003e","css":"","js":"","jsLocation":"footer","format":false,"phpExec":false,"output":"inline"} /-->

<!-- wp:gt-page-block/page-block {"name":"Connect Your Client","blockId":0,"blockSlug":"","content":"\u003csection class=\u0022sa-connect sa-alt\u0022 id=\u0022sa-connect\u0022 aria-labelledby=\u0022sa-connect-title\u0022\u003e\n  \u003cdiv class=\u0022sa-wrap\u0022\u003e\n    \u003cdiv class=\u0022sa-head sa-head\u002d\u002dsplit\u0022\u003e\u003ch2 id=\u0022sa-connect-title\u0022\u003eConnect Your AI Client\u003c/h2\u003e\u003cp\u003eSetup is 4 steps on your site and a few lines of configuration in your client. The Site Agent screen builds the token and tests the connection for you.\u003c/p\u003e\u003c/div\u003e\n    \u003col class=\u0022sa-steps\u0022\u003e\n      \u003cli\u003e\u003ch3\u003eInstall the Plugin\u003c/h3\u003e\u003cp\u003eUpload the ZIP from your account in Plugins \u0026gt; Add New, then open Tools \u0026gt; Site Agent.\u003c/p\u003e\u003c/li\u003e\n      \u003cli\u003e\u003ch3\u003eChoose the Tools\u003c/h3\u003e\u003cp\u003eEnable Site Agent and the tool groups your task needs, then save.\u003c/p\u003e\u003c/li\u003e\n      \u003cli\u003e\u003ch3\u003eCreate a Password\u003c/h3\u003e\u003cp\u003eCreate a dedicated Application Password in your WordPress profile for each client.\u003c/p\u003e\u003c/li\u003e\n      \u003cli\u003e\u003ch3\u003eTest the Connection\u003c/h3\u003e\u003cp\u003ePaste it into the token builder and click Test connection. It names the problem if something blocks the request.\u003c/p\u003e\u003c/li\u003e\n    \u003c/ol\u003e\n    \u003cfigure class=\u0022sa-shot\u0022\u003e\u003ca class=\u0022sa-shot-open\u0022 href=\u0022https://r2.gauravtiwari.org/wp-content/uploads/2026/10/site-agent-connection-diagnostics.png\u0022\u003e\u003cimg src=\u0022https://r2.gauravtiwari.org/wp-content/uploads/2026/10/site-agent-connection-diagnostics.png\u0022 alt=\u0022Site Agent diagnostics panel listing checks for the MCP runtime, the endpoint, HTTPS, Application Passwords and the PHP compile check\u0022 width=\u00222360\u0022 height=\u0022650\u0022 loading=\u0022lazy\u0022 decoding=\u0022async\u0022\u003e\u003c/a\u003e\u003cfigcaption\u003eTap the screenshot to open it at full size.\u003c/figcaption\u003e\u003c/figure\u003e\n    \u003cdiv class=\u0022sa-methods\u0022\u003e\n      \u003cdiv class=\u0022sa-method\u0022\u003e\u003cspan class=\u0022sa-tile\u0022 aria-hidden=\u0022true\u0022\u003e\u003csvg xmlns=\u0022http://www.w3.org/2000/svg\u0022 width=\u002224\u0022 height=\u002224\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022 class=\u0022sa-icon\u0022 aria-hidden=\u0022true\u0022 focusable=\u0022false\u0022\u003e\u003cpath d=\u0022M7 8l-4 4l4 4\u0022/\u003e\u003cpath d=\u0022M17 8l4 4l-4 4\u0022/\u003e\u003cpath d=\u0022M14 4l-4 16\u0022/\u003e\u003c/svg\u003e\u003c/span\u003e\u003ch3\u003eAuthorization Header\u003c/h3\u003e\u003cp\u003eThis is the safer option. Coding tools that let you add headers send \u003ccode\u003eAuthorization: Basic BASE64_TOKEN\u003c/code\u003e with every request, and the token never appears in a URL.\u003c/p\u003e\u003c/div\u003e\n      \u003cdiv class=\u0022sa-method\u0022\u003e\u003cspan class=\u0022sa-tile\u0022 aria-hidden=\u0022true\u0022\u003e\u003csvg xmlns=\u0022http://www.w3.org/2000/svg\u0022 width=\u002224\u0022 height=\u002224\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022 class=\u0022sa-icon\u0022 aria-hidden=\u0022true\u0022 focusable=\u0022false\u0022\u003e\u003cpath d=\u0022M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0\u0022/\u003e\u003cpath d=\u0022M3.6 9h16.8\u0022/\u003e\u003cpath d=\u0022M3.6 15h16.8\u0022/\u003e\u003cpath d=\u0022M11.5 3a17 17 0 0 0 0 18\u0022/\u003e\u003cpath d=\u0022M12.5 3a17 17 0 0 1 0 18\u0022/\u003e\u003c/svg\u003e\u003c/span\u003e\u003ch3\u003eAuthenticated URL\u003c/h3\u003e\u003cp\u003eApps that only accept a URL get the endpoint with \u003ccode\u003e?auth=BASE64_TOKEN\u003c/code\u003e added. URLs can end up in logs and browser history, and MCP's authorization guidance discourages tokens in them, so give this route a dedicated password you can revoke.\u003c/p\u003e\u003c/div\u003e\n    \u003c/div\u003e\n    \u003cdiv class=\u0022sa-guide\u0022\u003e\n      \u003cdiv class=\u0022sa-guide-intro\u0022\u003e\u003ch3\u003eSetup by Client\u003c/h3\u003e\u003cp\u003eReplace your-site.com with your domain and BASE64_TOKEN with the token from the Site Agent screen. The URL route works with Site Agent itself, but I haven't verified it inside every web app yet.\u003c/p\u003e\u003c/div\u003e\n      \u003cdiv class=\u0022sa-client-tabs\u0022 role=\u0022tablist\u0022 aria-label=\u0022AI clients\u0022\u003e\u003cbutton id=\u0022sa-client-tab-chatgpt\u0022 role=\u0022tab\u0022 aria-selected=\u0022true\u0022 aria-controls=\u0022sa-client-chatgpt\u0022 data-sa-client=\u0022chatgpt\u0022 tabindex=\u00220\u0022\u003eChatGPT\u003csmall\u003eURL\u003c/small\u003e\u003c/button\u003e\u003cbutton id=\u0022sa-client-tab-claude\u0022 role=\u0022tab\u0022 aria-selected=\u0022false\u0022 aria-controls=\u0022sa-client-claude\u0022 data-sa-client=\u0022claude\u0022 tabindex=\u0022-1\u0022\u003eClaude\u003csmall\u003eURL\u003c/small\u003e\u003c/button\u003e\u003cbutton id=\u0022sa-client-tab-gemini\u0022 role=\u0022tab\u0022 aria-selected=\u0022false\u0022 aria-controls=\u0022sa-client-gemini\u0022 data-sa-client=\u0022gemini\u0022 tabindex=\u0022-1\u0022\u003eGemini\u003csmall\u003eHeader\u003c/small\u003e\u003c/button\u003e\u003cbutton id=\u0022sa-client-tab-claude-code\u0022 role=\u0022tab\u0022 aria-selected=\u0022false\u0022 aria-controls=\u0022sa-client-claude-code\u0022 data-sa-client=\u0022claude-code\u0022 tabindex=\u0022-1\u0022\u003eClaude Code\u003csmall\u003eHeader\u003c/small\u003e\u003c/button\u003e\u003cbutton id=\u0022sa-client-tab-cursor\u0022 role=\u0022tab\u0022 aria-selected=\u0022false\u0022 aria-controls=\u0022sa-client-cursor\u0022 data-sa-client=\u0022cursor\u0022 tabindex=\u0022-1\u0022\u003eCursor\u003csmall\u003eHeader\u003c/small\u003e\u003c/button\u003e\u003cbutton id=\u0022sa-client-tab-vscode\u0022 role=\u0022tab\u0022 aria-selected=\u0022false\u0022 aria-controls=\u0022sa-client-vscode\u0022 data-sa-client=\u0022vscode\u0022 tabindex=\u0022-1\u0022\u003eVS Code\u003csmall\u003eHeader\u003c/small\u003e\u003c/button\u003e\u003cbutton id=\u0022sa-client-tab-codex\u0022 role=\u0022tab\u0022 aria-selected=\u0022false\u0022 aria-controls=\u0022sa-client-codex\u0022 data-sa-client=\u0022codex\u0022 tabindex=\u0022-1\u0022\u003eCodex\u003csmall\u003eHeader\u003c/small\u003e\u003c/button\u003e\u003cbutton id=\u0022sa-client-tab-zed\u0022 role=\u0022tab\u0022 aria-selected=\u0022false\u0022 aria-controls=\u0022sa-client-zed\u0022 data-sa-client=\u0022zed\u0022 tabindex=\u0022-1\u0022\u003eZed\u003csmall\u003eHeader\u003c/small\u003e\u003c/button\u003e\u003c/div\u003e\n      \u003cdiv class=\u0022sa-client-panels\u0022\u003e\u003cdiv class=\u0022sa-client\u0022 id=\u0022sa-client-chatgpt\u0022 role=\u0022tabpanel\u0022 aria-labelledby=\u0022sa-client-tab-chatgpt\u0022 tabindex=\u00220\u0022\u003e\u003cdiv class=\u0022sa-client-steps\u0022\u003e\u003ch3\u003eChatGPT\u003c/h3\u003e\u003cp\u003eChatGPT connects to MCP servers in developer mode on paid plans. It can't send a custom header, so it uses the authenticated URL.\u003c/p\u003e\u003col\u003e\u003cli\u003eTurn on URL authentication in Tools \u0026gt; Site Agent and copy the authenticated endpoint.\u003c/li\u003e\u003cli\u003eIn ChatGPT, open Settings and turn on Developer mode. OpenAI's guide lists the switch under Security and login.\u003c/li\u003e\u003cli\u003eAdd a new app with the plus button, name it Site Agent, paste the authenticated endpoint as the MCP server URL and choose No Authentication.\u003c/li\u003e\u003cli\u003eIn a chat, pick Developer mode from the + menu and select Site Agent.\u003c/li\u003e\u003c/ol\u003e\u003cp class=\u0022sa-small\u0022\u003eOpenAI offers developer mode to Plus, Pro, Business, Enterprise and Education accounts on the web. ChatGPT connects from OpenAI's servers, so your site must be public over HTTPS. I haven't verified that ChatGPT keeps the auth part of the URL on every request yet, so use a Header client if the connection fails.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0022sa-client-code\u0022\u003e\u003cspan class=\u0022sa-code-label\u0022\u003eMCP server URL\u003c/span\u003e\u003cpre\u003e\u003ccode id=\u0022sa-code-chatgpt\u0022\u003ehttps://your-site.com/wp-json/site-agent/v1/mcp?auth=BASE64_TOKEN\u003c/code\u003e\u003c/pre\u003e\u003cdiv class=\u0022sa-copy-row\u0022\u003e\u003cbutton type=\u0022button\u0022 class=\u0022sa-copy\u0022 data-sa-copy-target=\u0022sa-code-chatgpt\u0022\u003e\u003csvg xmlns=\u0022http://www.w3.org/2000/svg\u0022 width=\u002224\u0022 height=\u002224\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022 class=\u0022sa-icon\u0022 aria-hidden=\u0022true\u0022 focusable=\u0022false\u0022\u003e\u003cpath d=\u0022M7 9.667a2.667 2.667 0 0 1 2.667 -2.667h8.666a2.667 2.667 0 0 1 2.667 2.667v8.666a2.667 2.667 0 0 1 -2.667 2.667h-8.666a2.667 2.667 0 0 1 -2.667 -2.667l0 -8.666\u0022/\u003e\u003cpath d=\u0022M4.012 16.737a2.005 2.005 0 0 1 -1.012 -1.737v-10c0 -1.1 .9 -2 2 -2h10c.75 0 1.158 .385 1.5 1\u0022/\u003e\u003c/svg\u003eCopy\u003c/button\u003e\u003cspan class=\u0022sa-copy-status\u0022 role=\u0022status\u0022\u003e\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\u0022sa-client\u0022 id=\u0022sa-client-claude\u0022 role=\u0022tabpanel\u0022 aria-labelledby=\u0022sa-client-tab-claude\u0022 tabindex=\u00220\u0022 hidden\u003e\u003cdiv class=\u0022sa-client-steps\u0022\u003e\u003ch3\u003eClaude\u003c/h3\u003e\u003cp\u003eClaude.ai, Claude Desktop and the Claude mobile apps share custom connectors. Most plans can't send a custom header, so they use the authenticated URL.\u003c/p\u003e\u003col\u003e\u003cli\u003eTurn on URL authentication in Tools \u0026gt; Site Agent and copy the authenticated endpoint.\u003c/li\u003e\u003cli\u003eIn Claude, open Customize \u0026gt; Connectors and choose Add custom connector. On Team and Enterprise plans, an owner adds it from Organization settings \u0026gt; Connectors.\u003c/li\u003e\u003cli\u003ePaste the authenticated endpoint as the URL, choose No sign-in when Claude asks about authentication, then add it.\u003c/li\u003e\u003cli\u003eTurn Site Agent on for a chat from the tools menu.\u003c/li\u003e\u003c/ol\u003e\u003cp class=\u0022sa-small\u0022\u003eClaude connects from Anthropic's servers, so the site must be public over HTTPS and your firewall must let Anthropic's addresses through. The Free plan allows one custom connector. Organizations in Anthropic's request-header beta can send the Authorization header instead.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0022sa-client-code\u0022\u003e\u003cspan class=\u0022sa-code-label\u0022\u003eRemote MCP server URL\u003c/span\u003e\u003cpre\u003e\u003ccode id=\u0022sa-code-claude\u0022\u003ehttps://your-site.com/wp-json/site-agent/v1/mcp?auth=BASE64_TOKEN\u003c/code\u003e\u003c/pre\u003e\u003cdiv class=\u0022sa-copy-row\u0022\u003e\u003cbutton type=\u0022button\u0022 class=\u0022sa-copy\u0022 data-sa-copy-target=\u0022sa-code-claude\u0022\u003e\u003csvg xmlns=\u0022http://www.w3.org/2000/svg\u0022 width=\u002224\u0022 height=\u002224\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022 class=\u0022sa-icon\u0022 aria-hidden=\u0022true\u0022 focusable=\u0022false\u0022\u003e\u003cpath d=\u0022M7 9.667a2.667 2.667 0 0 1 2.667 -2.667h8.666a2.667 2.667 0 0 1 2.667 2.667v8.666a2.667 2.667 0 0 1 -2.667 2.667h-8.666a2.667 2.667 0 0 1 -2.667 -2.667l0 -8.666\u0022/\u003e\u003cpath d=\u0022M4.012 16.737a2.005 2.005 0 0 1 -1.012 -1.737v-10c0 -1.1 .9 -2 2 -2h10c.75 0 1.158 .385 1.5 1\u0022/\u003e\u003c/svg\u003eCopy\u003c/button\u003e\u003cspan class=\u0022sa-copy-status\u0022 role=\u0022status\u0022\u003e\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\u0022sa-client\u0022 id=\u0022sa-client-gemini\u0022 role=\u0022tabpanel\u0022 aria-labelledby=\u0022sa-client-tab-gemini\u0022 tabindex=\u00220\u0022 hidden\u003e\u003cdiv class=\u0022sa-client-steps\u0022\u003e\u003ch3\u003eGemini CLI\u003c/h3\u003e\u003cp\u003eGemini CLI connects with a header. Gemini Code Assist's agent mode in VS Code reads the same settings file.\u003c/p\u003e\u003col\u003e\u003cli\u003eCopy the Base64 token from Tools \u0026gt; Site Agent.\u003c/li\u003e\u003cli\u003eAdd the server to \u003ccode\u003e~/.gemini/settings.json\u003c/code\u003e, or to \u003ccode\u003e.gemini/settings.json\u003c/code\u003e in one project.\u003c/li\u003e\u003cli\u003eRestart Gemini CLI and run /mcp to check the tools.\u003c/li\u003e\u003c/ol\u003e\u003cp class=\u0022sa-small\u0022\u003eThe Gemini app on the web can add custom MCP apps for personal accounts in the US, but it links accounts through sign-in, and I haven't verified it with the authenticated URL.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0022sa-client-code\u0022\u003e\u003cspan class=\u0022sa-code-label\u0022\u003e~/.gemini/settings.json\u003c/span\u003e\u003cpre\u003e\u003ccode id=\u0022sa-code-gemini\u0022\u003e{\n  \u0022mcpServers\u0022: {\n    \u0022site-agent\u0022: {\n      \u0022httpUrl\u0022: \u0022https://your-site.com/wp-json/site-agent/v1/mcp\u0022,\n      \u0022headers\u0022: {\n        \u0022Authorization\u0022: \u0022Basic BASE64_TOKEN\u0022\n      }\n    }\n  }\n}\u003c/code\u003e\u003c/pre\u003e\u003cdiv class=\u0022sa-copy-row\u0022\u003e\u003cbutton type=\u0022button\u0022 class=\u0022sa-copy\u0022 data-sa-copy-target=\u0022sa-code-gemini\u0022\u003e\u003csvg xmlns=\u0022http://www.w3.org/2000/svg\u0022 width=\u002224\u0022 height=\u002224\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022 class=\u0022sa-icon\u0022 aria-hidden=\u0022true\u0022 focusable=\u0022false\u0022\u003e\u003cpath d=\u0022M7 9.667a2.667 2.667 0 0 1 2.667 -2.667h8.666a2.667 2.667 0 0 1 2.667 2.667v8.666a2.667 2.667 0 0 1 -2.667 2.667h-8.666a2.667 2.667 0 0 1 -2.667 -2.667l0 -8.666\u0022/\u003e\u003cpath d=\u0022M4.012 16.737a2.005 2.005 0 0 1 -1.012 -1.737v-10c0 -1.1 .9 -2 2 -2h10c.75 0 1.158 .385 1.5 1\u0022/\u003e\u003c/svg\u003eCopy\u003c/button\u003e\u003cspan class=\u0022sa-copy-status\u0022 role=\u0022status\u0022\u003e\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\u0022sa-client\u0022 id=\u0022sa-client-claude-code\u0022 role=\u0022tabpanel\u0022 aria-labelledby=\u0022sa-client-tab-claude-code\u0022 tabindex=\u00220\u0022 hidden\u003e\u003cdiv class=\u0022sa-client-steps\u0022\u003e\u003ch3\u003eClaude Code\u003c/h3\u003e\u003cp\u003eClaude Code adds a remote server with one command and sends the Authorization header on every request.\u003c/p\u003e\u003col\u003e\u003cli\u003eCopy the Base64 token from Tools \u0026gt; Site Agent.\u003c/li\u003e\u003cli\u003eRun the command below in your project folder.\u003c/li\u003e\u003cli\u003eRun /mcp inside Claude Code to confirm Site Agent is connected.\u003c/li\u003e\u003c/ol\u003e\u003cp class=\u0022sa-small\u0022\u003eAdd \u003ccode\u003e\u002d\u002dscope user\u003c/code\u003e to use the server in every project.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0022sa-client-code\u0022\u003e\u003cspan class=\u0022sa-code-label\u0022\u003eTerminal\u003c/span\u003e\u003cpre\u003e\u003ccode id=\u0022sa-code-claude-code\u0022\u003eclaude mcp add \u002d\u002dtransport http site-agent https://your-site.com/wp-json/site-agent/v1/mcp \u005c\n  \u002d\u002dheader \u0022Authorization: Basic BASE64_TOKEN\u0022\u003c/code\u003e\u003c/pre\u003e\u003cdiv class=\u0022sa-copy-row\u0022\u003e\u003cbutton type=\u0022button\u0022 class=\u0022sa-copy\u0022 data-sa-copy-target=\u0022sa-code-claude-code\u0022\u003e\u003csvg xmlns=\u0022http://www.w3.org/2000/svg\u0022 width=\u002224\u0022 height=\u002224\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022 class=\u0022sa-icon\u0022 aria-hidden=\u0022true\u0022 focusable=\u0022false\u0022\u003e\u003cpath d=\u0022M7 9.667a2.667 2.667 0 0 1 2.667 -2.667h8.666a2.667 2.667 0 0 1 2.667 2.667v8.666a2.667 2.667 0 0 1 -2.667 2.667h-8.666a2.667 2.667 0 0 1 -2.667 -2.667l0 -8.666\u0022/\u003e\u003cpath d=\u0022M4.012 16.737a2.005 2.005 0 0 1 -1.012 -1.737v-10c0 -1.1 .9 -2 2 -2h10c.75 0 1.158 .385 1.5 1\u0022/\u003e\u003c/svg\u003eCopy\u003c/button\u003e\u003cspan class=\u0022sa-copy-status\u0022 role=\u0022status\u0022\u003e\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\u0022sa-client\u0022 id=\u0022sa-client-cursor\u0022 role=\u0022tabpanel\u0022 aria-labelledby=\u0022sa-client-tab-cursor\u0022 tabindex=\u00220\u0022 hidden\u003e\u003cdiv class=\u0022sa-client-steps\u0022\u003e\u003ch3\u003eCursor\u003c/h3\u003e\u003cp\u003eCursor reads MCP servers from mcp.json and sends the headers you set.\u003c/p\u003e\u003col\u003e\u003cli\u003eCopy the Base64 token from Tools \u0026gt; Site Agent.\u003c/li\u003e\u003cli\u003eAdd the server to \u003ccode\u003e~/.cursor/mcp.json\u003c/code\u003e, or to \u003ccode\u003e.cursor/mcp.json\u003c/code\u003e in one project.\u003c/li\u003e\u003cli\u003eCheck that Site Agent appears in Cursor's MCP settings with its tools.\u003c/li\u003e\u003c/ol\u003e\u003cp class=\u0022sa-small\u0022\u003eCursor can read the value from an environment variable with \u003ccode\u003e${env:SITE_AGENT_AUTH}\u003c/code\u003e, which keeps the token out of the file.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0022sa-client-code\u0022\u003e\u003cspan class=\u0022sa-code-label\u0022\u003e~/.cursor/mcp.json\u003c/span\u003e\u003cpre\u003e\u003ccode id=\u0022sa-code-cursor\u0022\u003e{\n  \u0022mcpServers\u0022: {\n    \u0022site-agent\u0022: {\n      \u0022url\u0022: \u0022https://your-site.com/wp-json/site-agent/v1/mcp\u0022,\n      \u0022headers\u0022: {\n        \u0022Authorization\u0022: \u0022Basic BASE64_TOKEN\u0022\n      }\n    }\n  }\n}\u003c/code\u003e\u003c/pre\u003e\u003cdiv class=\u0022sa-copy-row\u0022\u003e\u003cbutton type=\u0022button\u0022 class=\u0022sa-copy\u0022 data-sa-copy-target=\u0022sa-code-cursor\u0022\u003e\u003csvg xmlns=\u0022http://www.w3.org/2000/svg\u0022 width=\u002224\u0022 height=\u002224\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022 class=\u0022sa-icon\u0022 aria-hidden=\u0022true\u0022 focusable=\u0022false\u0022\u003e\u003cpath d=\u0022M7 9.667a2.667 2.667 0 0 1 2.667 -2.667h8.666a2.667 2.667 0 0 1 2.667 2.667v8.666a2.667 2.667 0 0 1 -2.667 2.667h-8.666a2.667 2.667 0 0 1 -2.667 -2.667l0 -8.666\u0022/\u003e\u003cpath d=\u0022M4.012 16.737a2.005 2.005 0 0 1 -1.012 -1.737v-10c0 -1.1 .9 -2 2 -2h10c.75 0 1.158 .385 1.5 1\u0022/\u003e\u003c/svg\u003eCopy\u003c/button\u003e\u003cspan class=\u0022sa-copy-status\u0022 role=\u0022status\u0022\u003e\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\u0022sa-client\u0022 id=\u0022sa-client-vscode\u0022 role=\u0022tabpanel\u0022 aria-labelledby=\u0022sa-client-tab-vscode\u0022 tabindex=\u00220\u0022 hidden\u003e\u003cdiv class=\u0022sa-client-steps\u0022\u003e\u003ch3\u003eVS Code\u003c/h3\u003e\u003cp\u003eVS Code uses MCP servers in GitHub Copilot agent mode. An input variable keeps the token out of the file.\u003c/p\u003e\u003col\u003e\u003cli\u003eCopy the Base64 token from Tools \u0026gt; Site Agent.\u003c/li\u003e\u003cli\u003eAdd the configuration to \u003ccode\u003e.vscode/mcp.json\u003c/code\u003e in your workspace.\u003c/li\u003e\u003cli\u003eStart the server from the file, paste the token when VS Code asks and pick the tools in agent mode.\u003c/li\u003e\u003c/ol\u003e\u003cp class=\u0022sa-small\u0022\u003eOn Copilot Business and Enterprise, an admin has to allow MCP servers in Copilot first.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0022sa-client-code\u0022\u003e\u003cspan class=\u0022sa-code-label\u0022\u003e.vscode/mcp.json\u003c/span\u003e\u003cpre\u003e\u003ccode id=\u0022sa-code-vscode\u0022\u003e{\n  \u0022inputs\u0022: [\n    {\n      \u0022type\u0022: \u0022promptString\u0022,\n      \u0022id\u0022: \u0022site-agent-token\u0022,\n      \u0022description\u0022: \u0022Site Agent Base64 token\u0022,\n      \u0022password\u0022: true\n    }\n  ],\n  \u0022servers\u0022: {\n    \u0022site-agent\u0022: {\n      \u0022type\u0022: \u0022http\u0022,\n      \u0022url\u0022: \u0022https://your-site.com/wp-json/site-agent/v1/mcp\u0022,\n      \u0022headers\u0022: {\n        \u0022Authorization\u0022: \u0022Basic ${input:site-agent-token}\u0022\n      }\n    }\n  }\n}\u003c/code\u003e\u003c/pre\u003e\u003cdiv class=\u0022sa-copy-row\u0022\u003e\u003cbutton type=\u0022button\u0022 class=\u0022sa-copy\u0022 data-sa-copy-target=\u0022sa-code-vscode\u0022\u003e\u003csvg xmlns=\u0022http://www.w3.org/2000/svg\u0022 width=\u002224\u0022 height=\u002224\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022 class=\u0022sa-icon\u0022 aria-hidden=\u0022true\u0022 focusable=\u0022false\u0022\u003e\u003cpath d=\u0022M7 9.667a2.667 2.667 0 0 1 2.667 -2.667h8.666a2.667 2.667 0 0 1 2.667 2.667v8.666a2.667 2.667 0 0 1 -2.667 2.667h-8.666a2.667 2.667 0 0 1 -2.667 -2.667l0 -8.666\u0022/\u003e\u003cpath d=\u0022M4.012 16.737a2.005 2.005 0 0 1 -1.012 -1.737v-10c0 -1.1 .9 -2 2 -2h10c.75 0 1.158 .385 1.5 1\u0022/\u003e\u003c/svg\u003eCopy\u003c/button\u003e\u003cspan class=\u0022sa-copy-status\u0022 role=\u0022status\u0022\u003e\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\u0022sa-client\u0022 id=\u0022sa-client-codex\u0022 role=\u0022tabpanel\u0022 aria-labelledby=\u0022sa-client-tab-codex\u0022 tabindex=\u00220\u0022 hidden\u003e\u003cdiv class=\u0022sa-client-steps\u0022\u003e\u003ch3\u003eCodex\u003c/h3\u003e\u003cp\u003eThe Codex CLI, the Codex IDE extension and the ChatGPT desktop app share one config file, and it can send a header to an HTTP server.\u003c/p\u003e\u003col\u003e\u003cli\u003eCopy the Base64 token from Tools \u0026gt; Site Agent.\u003c/li\u003e\u003cli\u003eAdd the server to \u003ccode\u003e~/.codex/config.toml\u003c/code\u003e. The \u003ccode\u003ecodex mcp add\u003c/code\u003e command can't set this header, so edit the file.\u003c/li\u003e\u003cli\u003eRestart Codex and run /mcp to check the tools.\u003c/li\u003e\u003c/ol\u003e\u003cp class=\u0022sa-small\u0022\u003eUse \u003ccode\u003eenv_http_headers\u003c/code\u003e instead to read the value from an environment variable.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0022sa-client-code\u0022\u003e\u003cspan class=\u0022sa-code-label\u0022\u003e~/.codex/config.toml\u003c/span\u003e\u003cpre\u003e\u003ccode id=\u0022sa-code-codex\u0022\u003e[mcp_servers.site-agent]\nurl = \u0022https://your-site.com/wp-json/site-agent/v1/mcp\u0022\nhttp_headers = { \u0022Authorization\u0022 = \u0022Basic BASE64_TOKEN\u0022 }\u003c/code\u003e\u003c/pre\u003e\u003cdiv class=\u0022sa-copy-row\u0022\u003e\u003cbutton type=\u0022button\u0022 class=\u0022sa-copy\u0022 data-sa-copy-target=\u0022sa-code-codex\u0022\u003e\u003csvg xmlns=\u0022http://www.w3.org/2000/svg\u0022 width=\u002224\u0022 height=\u002224\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022 class=\u0022sa-icon\u0022 aria-hidden=\u0022true\u0022 focusable=\u0022false\u0022\u003e\u003cpath d=\u0022M7 9.667a2.667 2.667 0 0 1 2.667 -2.667h8.666a2.667 2.667 0 0 1 2.667 2.667v8.666a2.667 2.667 0 0 1 -2.667 2.667h-8.666a2.667 2.667 0 0 1 -2.667 -2.667l0 -8.666\u0022/\u003e\u003cpath d=\u0022M4.012 16.737a2.005 2.005 0 0 1 -1.012 -1.737v-10c0 -1.1 .9 -2 2 -2h10c.75 0 1.158 .385 1.5 1\u0022/\u003e\u003c/svg\u003eCopy\u003c/button\u003e\u003cspan class=\u0022sa-copy-status\u0022 role=\u0022status\u0022\u003e\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\u0022sa-client\u0022 id=\u0022sa-client-zed\u0022 role=\u0022tabpanel\u0022 aria-labelledby=\u0022sa-client-tab-zed\u0022 tabindex=\u00220\u0022 hidden\u003e\u003cdiv class=\u0022sa-client-steps\u0022\u003e\u003ch3\u003eZed\u003c/h3\u003e\u003cp\u003eZed adds remote MCP servers as context servers in its settings file and sends the headers you set.\u003c/p\u003e\u003col\u003e\u003cli\u003eCopy the Base64 token from Tools \u0026gt; Site Agent.\u003c/li\u003e\u003cli\u003eOpen Zed's \u003ccode\u003esettings.json\u003c/code\u003e and add the server under \u003ccode\u003econtext_servers\u003c/code\u003e.\u003c/li\u003e\u003cli\u003eOpen the agent panel and check that Site Agent's tools are listed.\u003c/li\u003e\u003c/ol\u003e\u003cp class=\u0022sa-small\u0022\u003eWithout an Authorization header, Zed tries OAuth, which Site Agent doesn't offer.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0022sa-client-code\u0022\u003e\u003cspan class=\u0022sa-code-label\u0022\u003esettings.json\u003c/span\u003e\u003cpre\u003e\u003ccode id=\u0022sa-code-zed\u0022\u003e{\n  \u0022context_servers\u0022: {\n    \u0022site-agent\u0022: {\n      \u0022url\u0022: \u0022https://your-site.com/wp-json/site-agent/v1/mcp\u0022,\n      \u0022headers\u0022: {\n        \u0022Authorization\u0022: \u0022Basic BASE64_TOKEN\u0022\n      }\n    }\n  }\n}\u003c/code\u003e\u003c/pre\u003e\u003cdiv class=\u0022sa-copy-row\u0022\u003e\u003cbutton type=\u0022button\u0022 class=\u0022sa-copy\u0022 data-sa-copy-target=\u0022sa-code-zed\u0022\u003e\u003csvg xmlns=\u0022http://www.w3.org/2000/svg\u0022 width=\u002224\u0022 height=\u002224\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022 class=\u0022sa-icon\u0022 aria-hidden=\u0022true\u0022 focusable=\u0022false\u0022\u003e\u003cpath d=\u0022M7 9.667a2.667 2.667 0 0 1 2.667 -2.667h8.666a2.667 2.667 0 0 1 2.667 2.667v8.666a2.667 2.667 0 0 1 -2.667 2.667h-8.666a2.667 2.667 0 0 1 -2.667 -2.667l0 -8.666\u0022/\u003e\u003cpath d=\u0022M4.012 16.737a2.005 2.005 0 0 1 -1.012 -1.737v-10c0 -1.1 .9 -2 2 -2h10c.75 0 1.158 .385 1.5 1\u0022/\u003e\u003c/svg\u003eCopy\u003c/button\u003e\u003cspan class=\u0022sa-copy-status\u0022 role=\u0022status\u0022\u003e\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n    \u003c/div\u003e\n    \u003cdiv class=\u0022sa-requirements\u0022\u003e\n      \u003cdiv\u003e\u003cstrong\u003eWordPress 6.9+\u003c/strong\u003e\u003cspan\u003eWith the Abilities API\u003c/span\u003e\u003c/div\u003e\n      \u003cdiv\u003e\u003cstrong\u003ePHP 8.0+\u003c/strong\u003e\u003cspan\u003eOn the web server\u003c/span\u003e\u003c/div\u003e\n      \u003cdiv\u003e\u003cstrong\u003eHTTPS\u003c/strong\u003e\u003cspan\u003eRequired for remote clients\u003c/span\u003e\u003c/div\u003e\n      \u003cdiv\u003e\u003cstrong\u003eAdministrator\u003c/strong\u003e\u003cspan\u003eSuper administrator on multisite\u003c/span\u003e\u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\u003c/section\u003e","css":"","js":"","jsLocation":"footer","format":false,"phpExec":false,"output":"inline"} /-->

<!-- wp:gt-page-block/page-block {"name":"Free Offer","blockId":0,"blockSlug":"","content":"\u003csection class=\u0022sa-offer sa-alt\u0022 id=\u0022sa-download\u0022 aria-labelledby=\u0022sa-download-title\u0022\u003e\n  \u003cdiv class=\u0022sa-wrap sa-offer-grid\u0022\u003e\n    \u003cdiv class=\u0022sa-offer-copy\u0022\u003e\u003ch2 id=\u0022sa-download-title\u0022\u003eSite Agent Is Free\u003c/h2\u003e\u003cp\u003eThe free checkout gives you the complete plugin and a license for automatic updates.\u003c/p\u003e\u003cp\u003eThe code is public and GPL-licensed, and every tool works without activating the license. The license only connects your site to the update service, so new versions arrive in your Plugins screen.\u003c/p\u003e\u003ca class=\u0022sa-text-link\u0022 href=\u0022https://github.com/wpgaurav/site-agent\u0022 target=\u0022_blank\u0022 rel=\u0022noopener nofollow\u0022\u003eBrowse the Source on GitHub \u003cspan aria-hidden=\u0022true\u0022\u003e\u003csvg xmlns=\u0022http://www.w3.org/2000/svg\u0022 width=\u002224\u0022 height=\u002224\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022 class=\u0022sa-icon\u0022 aria-hidden=\u0022true\u0022 focusable=\u0022false\u0022\u003e\u003cpath d=\u0022M17 7l-10 10\u0022/\u003e\u003cpath d=\u0022M8 7l9 0l0 9\u0022/\u003e\u003c/svg\u003e\u003c/span\u003e\u003c/a\u003e\u003c/div\u003e\n    \u003cdiv class=\u0022sa-offer-action\u0022\u003e\n      \u003cdiv class=\u0022sa-price\u0022\u003e\u003cstrong\u003e$0\u003c/strong\u003e\u003cspan\u003ePlugin and update license\u003c/span\u003e\u003c/div\u003e\n      \u003cul class=\u0022sa-bullets sa-includes\u0022\u003e\u003cli\u003eAll 18 tools and the safety checks\u003c/li\u003e\u003cli\u003eSkills for Gutenberg, GenerateBlocks, Elementor, Bricks and Divi\u003c/li\u003e\u003cli\u003eBricks' own abilities on Bricks 2.4 and later\u003c/li\u003e\u003cli\u003eAutomatic updates with the free license\u003c/li\u003e\u003cli\u003eWordPress 6.9 or newer and PHP 8.0 or newer\u003c/li\u003e\u003c/ul\u003e\n      \u003ca class=\u0022sa-button sa-button-primary\u0022 href=\u0022https://gauravtiwari.org/?fluent-cart=instant_checkout\u0026item_id=131\u0026quantity=1\u0022 data-sa-cta=\u0022offer\u0022\u003eGet Site Agent \u003cspan aria-hidden=\u0022true\u0022\u003e\u003csvg xmlns=\u0022http://www.w3.org/2000/svg\u0022 width=\u002224\u0022 height=\u002224\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022 class=\u0022sa-icon\u0022 aria-hidden=\u0022true\u0022 focusable=\u0022false\u0022\u003e\u003cpath d=\u0022M17 7l-10 10\u0022/\u003e\u003cpath d=\u0022M8 7l9 0l0 9\u0022/\u003e\u003c/svg\u003e\u003c/span\u003e\u003c/a\u003e\n      \u003cp class=\u0022sa-small\u0022\u003eThe download and license key appear in your account after the free checkout.\u003c/p\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\u003c/section\u003e","css":"","js":"","jsLocation":"footer","format":false,"phpExec":false,"output":"inline"} /-->

<!-- wp:gt-page-block/page-block {"name":"Questions","blockId":0,"blockSlug":"","content":"\u003csection class=\u0022sa-faq\u0022 aria-labelledby=\u0022sa-faq-title\u0022\u003e\n  \u003cdiv class=\u0022sa-wrap sa-faq-grid\u0022\u003e\n    \u003cdiv class=\u0022sa-faq-intro\u0022\u003e\u003ch2 id=\u0022sa-faq-title\u0022\u003eBefore You Connect\u003c/h2\u003e\u003cp\u003eThese are the questions worth settling before you give an agent access to a site.\u003c/p\u003e\u003c/div\u003e\n    \u003cdiv class=\u0022sa-questions\u0022\u003e\n      \u003cdetails\u003e\u003csummary\u003eWhich AI clients can connect?\u003cspan aria-hidden=\u0022true\u0022\u003e\u003csvg xmlns=\u0022http://www.w3.org/2000/svg\u0022 width=\u002224\u0022 height=\u002224\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022 class=\u0022sa-icon\u0022 aria-hidden=\u0022true\u0022 focusable=\u0022false\u0022\u003e\u003cpath d=\u0022M12 5l0 14\u0022/\u003e\u003cpath d=\u0022M5 12l14 0\u0022/\u003e\u003c/svg\u003e\u003c/span\u003e\u003c/summary\u003e\u003cp\u003eAny client that supports remote MCP servers over Streamable HTTP can connect, in one of two ways:\u003c/p\u003e\u003cul class=\u0022sa-bullets\u0022\u003e\u003cli\u003eCoding tools that let you add headers send an Authorization header.\u003c/li\u003e\u003cli\u003eApps that only take a URL use the authenticated URL.\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eSite Agent doesn't provide OAuth. A client that only accepts OAuth needs a compatible bridge.\u003c/p\u003e\u003c/details\u003e\n      \u003cdetails\u003e\u003csummary\u003eIs it safe to give an AI agent write access?\u003cspan aria-hidden=\u0022true\u0022\u003e\u003csvg xmlns=\u0022http://www.w3.org/2000/svg\u0022 width=\u002224\u0022 height=\u002224\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022 class=\u0022sa-icon\u0022 aria-hidden=\u0022true\u0022 focusable=\u0022false\u0022\u003e\u003cpath d=\u0022M12 5l0 14\u0022/\u003e\u003cpath d=\u0022M5 12l14 0\u0022/\u003e\u003c/svg\u003e\u003c/span\u003e\u003c/summary\u003e\u003cp\u003eIt is safe enough for content work on most sites, because edits to live posts are staged and every update is checked against the last read. The developer tools are a different matter. They run with server privileges, so I'd keep them on a staging site with a backup and give production passwords content access only.\u003c/p\u003e\u003c/details\u003e\n      \u003cdetails\u003e\u003csummary\u003eWhat happens when the agent edits a published post?\u003cspan aria-hidden=\u0022true\u0022\u003e\u003csvg xmlns=\u0022http://www.w3.org/2000/svg\u0022 width=\u002224\u0022 height=\u002224\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022 class=\u0022sa-icon\u0022 aria-hidden=\u0022true\u0022 focusable=\u0022false\u0022\u003e\u003cpath d=\u0022M12 5l0 14\u0022/\u003e\u003cpath d=\u0022M5 12l14 0\u0022/\u003e\u003c/svg\u003e\u003c/span\u003e\u003c/summary\u003e\u003cp\u003eThe change is saved as your autosave. WordPress shows it in the editor next to the live version, and you decide whether to restore and publish it. The agent can update the live post directly only by passing a status, and it should do that only when you've asked for it.\u003c/p\u003e\u003c/details\u003e\n      \u003cdetails\u003e\u003csummary\u003eDoes it work with Elementor, Bricks or Divi?\u003cspan aria-hidden=\u0022true\u0022\u003e\u003csvg xmlns=\u0022http://www.w3.org/2000/svg\u0022 width=\u002224\u0022 height=\u002224\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022 class=\u0022sa-icon\u0022 aria-hidden=\u0022true\u0022 focusable=\u0022false\u0022\u003e\u003cpath d=\u0022M12 5l0 14\u0022/\u003e\u003cpath d=\u0022M5 12l14 0\u0022/\u003e\u003c/svg\u003e\u003c/span\u003e\u003c/summary\u003e\u003cp\u003eYes. Site Agent tells the agent which builder stores each page's layout, and the matching skill explains how to change it. Content writes refuse raw Elementor, Bricks and Divi layout data, because writing it directly skips the builder's validation and cache refresh.\u003c/p\u003e\u003cul class=\u0022sa-bullets\u0022\u003e\u003cli\u003eOn Bricks 2.4 and later, switch on Bricks tools and the agent works through Bricks' own abilities.\u003c/li\u003e\u003cli\u003eElementor changes need the PHP tool, because Elementor's own save runs in PHP.\u003c/li\u003e\u003cli\u003eDivi pages are edited like other post content.\u003c/li\u003e\u003c/ul\u003e\u003c/details\u003e\n      \u003cdetails\u003e\u003csummary\u003eWhere does my site's data go?\u003cspan aria-hidden=\u0022true\u0022\u003e\u003csvg xmlns=\u0022http://www.w3.org/2000/svg\u0022 width=\u002224\u0022 height=\u002224\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022 class=\u0022sa-icon\u0022 aria-hidden=\u0022true\u0022 focusable=\u0022false\u0022\u003e\u003cpath d=\u0022M12 5l0 14\u0022/\u003e\u003cpath d=\u0022M5 12l14 0\u0022/\u003e\u003c/svg\u003e\u003c/span\u003e\u003c/summary\u003e\u003cp\u003eYour AI client connects directly to WordPress. Site Agent has no hosted proxy and no telemetry. The client and its AI provider handle tool results under their own privacy policy.\u003c/p\u003e\u003cp\u003eAutomatic updates send gauravtiwari.org:\u003c/p\u003e\u003cul class=\u0022sa-bullets\u0022\u003e\u003cli\u003eyour license key and activation\u003c/li\u003e\u003cli\u003eyour site URL\u003c/li\u003e\u003cli\u003ethe plugin, WordPress and PHP versions\u003c/li\u003e\u003c/ul\u003e\u003cp\u003ePHP and WP-CLI can also make outbound requests when the agent asks them to.\u003c/p\u003e\u003c/details\u003e\n      \u003cdetails\u003e\u003csummary\u003eWhat can the file tools reach?\u003cspan aria-hidden=\u0022true\u0022\u003e\u003csvg xmlns=\u0022http://www.w3.org/2000/svg\u0022 width=\u002224\u0022 height=\u002224\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022 class=\u0022sa-icon\u0022 aria-hidden=\u0022true\u0022 focusable=\u0022false\u0022\u003e\u003cpath d=\u0022M12 5l0 14\u0022/\u003e\u003cpath d=\u0022M5 12l14 0\u0022/\u003e\u003c/svg\u003e\u003c/span\u003e\u003c/summary\u003e\u003cp\u003eThe file tools work only inside these folders in wp-content:\u003c/p\u003e\u003cul class=\u0022sa-bullets\u0022\u003e\u003cli\u003e\u003ccode\u003eplugins\u003c/code\u003e\u003c/li\u003e\u003cli\u003e\u003ccode\u003ethemes\u003c/code\u003e\u003c/li\u003e\u003cli\u003e\u003ccode\u003emu-plugins\u003c/code\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eHidden files and symlinks are blocked, and so are credential files such as wp-config.php and auth.json. Site Agent can't edit its own files. Source code can still contain secrets, which is why source inspection has its own switch.\u003c/p\u003e\u003c/details\u003e\n      \u003cdetails\u003e\u003csummary\u003eHow do updates work?\u003cspan aria-hidden=\u0022true\u0022\u003e\u003csvg xmlns=\u0022http://www.w3.org/2000/svg\u0022 width=\u002224\u0022 height=\u002224\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022 class=\u0022sa-icon\u0022 aria-hidden=\u0022true\u0022 focusable=\u0022false\u0022\u003e\u003cpath d=\u0022M12 5l0 14\u0022/\u003e\u003cpath d=\u0022M5 12l14 0\u0022/\u003e\u003c/svg\u003e\u003c/span\u003e\u003c/summary\u003e\u003cp\u003eComplete the free checkout, then activate the license on the Site Agent screen. New versions then appear in your Plugins screen like any other update. The license controls updates only, and you can always install a release ZIP by hand.\u003c/p\u003e\u003c/details\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\u003c/section\u003e","css":"","js":"","jsLocation":"footer","format":false,"phpExec":false,"output":"inline"} /-->

<!-- wp:gt-page-block/page-block {"name":"Final Action","blockId":0,"blockSlug":"","content":"\u003csection class=\u0022sa-close\u0022 aria-labelledby=\u0022sa-close-title\u0022\u003e\u003cdiv class=\u0022sa-wrap\u0022\u003e\u003ch2 id=\u0022sa-close-title\u0022\u003eStart With a Staging Site\u003c/h2\u003e\u003cp\u003eConnect your agent, check what it can read, then switch on more tools when the task needs them.\u003c/p\u003e\u003cdiv class=\u0022sa-actions\u0022\u003e\u003ca class=\u0022sa-button sa-button-primary\u0022 href=\u0022https://gauravtiwari.org/?fluent-cart=instant_checkout\u0026item_id=131\u0026quantity=1\u0022 data-sa-cta=\u0022close\u0022\u003eGet Site Agent \u003cspan aria-hidden=\u0022true\u0022\u003e\u003csvg xmlns=\u0022http://www.w3.org/2000/svg\u0022 width=\u002224\u0022 height=\u002224\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022 class=\u0022sa-icon\u0022 aria-hidden=\u0022true\u0022 focusable=\u0022false\u0022\u003e\u003cpath d=\u0022M17 7l-10 10\u0022/\u003e\u003cpath d=\u0022M8 7l9 0l0 9\u0022/\u003e\u003c/svg\u003e\u003c/span\u003e\u003c/a\u003e\u003ca class=\u0022sa-button sa-button-ghost\u0022 href=\u0022https://github.com/wpgaurav/site-agent\u0022 target=\u0022_blank\u0022 rel=\u0022noopener nofollow\u0022\u003eView the Source \u003cspan aria-hidden=\u0022true\u0022\u003e\u003csvg xmlns=\u0022http://www.w3.org/2000/svg\u0022 width=\u002224\u0022 height=\u002224\u0022 viewBox=\u00220 0 24 24\u0022 fill=\u0022none\u0022 stroke=\u0022currentColor\u0022 stroke-width=\u00222\u0022 stroke-linecap=\u0022round\u0022 stroke-linejoin=\u0022round\u0022 class=\u0022sa-icon\u0022 aria-hidden=\u0022true\u0022 focusable=\u0022false\u0022\u003e\u003cpath d=\u0022M17 7l-10 10\u0022/\u003e\u003cpath d=\u0022M8 7l9 0l0 9\u0022/\u003e\u003c/svg\u003e\u003c/span\u003e\u003c/a\u003e\u003c/div\u003e\u003c/div\u003e\u003c/section\u003e","css":"","js":"(()=\u003e{const root=document.querySelector('.sa');if(!root||root.dataset.saReady)return;root.dataset.saReady='true';\nconst examples={\ncontent:{title:'Stage an Edit to a Live Post',copy:'The agent sends the new content with the hash it got when it read the post. The post is published and no status is passed, so WordPress saves the change as an autosave for you to review.',access:'Content writes',limit:'The live post changes only when the agent passes a status such as publish.',call:{name:'site-agent-save-content',arguments:{post_id:42,content:'\u005cu003c!\u002d\u002d wp:paragraph \u002d\u002d\u005cu003e\u005cu003cp\u005cu003eA clearer intro.\u005cu003c/p\u005cu003e\u005cu003c!\u002d\u002d /wp:paragraph \u002d\u002d\u005cu003e',expected_content_sha256:'9f2c6a...'}}},\nmedia:{title:'Import an Image With Alt Text',copy:'The agent passes a public image URL and the alt text. WordPress downloads the file, checks its type and adds it to the library, and the returned ID can become the featured image.',access:'Content writes',limit:'Private and loopback addresses are refused, and the file must fit your upload limit.',call:{name:'site-agent-upload-media',arguments:{url:'https://example.com/images/dashboard.png',alt:'Analytics dashboard showing weekly visits',post_id:42}}},\nsource:{title:'Edit a Theme File Safely',copy:'The write must include the hash from the last read. Site Agent checks the PHP, saves the file, loads your site and puts the old file back if the change causes a fatal error.',access:'Source inspection and source editing',limit:'Source editing changes executable code. Keep it on staging with a backup.',call:{name:'site-agent-write-file',arguments:{path:'themes/your-theme/functions.php',content:'\u005cu003c?php\u005cn// Updated theme setup.',expected_sha256:'4b7e1d...'}}},\nphp:{title:'Run PHP Inside WordPress',copy:'The agent runs PHP with WordPress loaded and gets the echoed output and the return value. When the code fails, the error comes back with its message and line.',access:'PHP execution',limit:'PHP runs with server privileges and is not isolated. Code that calls exit or die is rejected.',call:{name:'site-agent-execute-php',arguments:{code:'return get_bloginfo(\u0022version\u0022);'}}},\ncli:{title:'Run a WP-CLI Command',copy:'The agent passes WP-CLI arguments as an array. Commands run on this installation as the signed-in WordPress user, without a shell.',access:'WP-CLI execution',limit:'Foreground commands stop after 20 seconds by default. WP-CLI must be installed on the server.',call:{name:'site-agent-run-wp-cli',arguments:{arguments:['plugin','list','\u002d\u002dformat=json']}}},\nbricks:{title:'Read a Bricks Page Summary',copy:'On Bricks 2.4 and later, the agent runs Bricks\u005c' own abilities through Site Agent. A summary read returns the element counts, headings and structure of a page, so even a very large layout fits in one answer.',access:'Bricks tools',limit:'Bricks checks its own permissions, and its PHP ability also needs PHP execution.',call:{name:'site-agent-run-bricks-ability',arguments:{ability_name:'bricks/get-page-elements',parameters:{postId:42,responseFormat:'summary'}}}}};\nconst roving=(tabs,activate)=\u003etabs.forEach((tab,index)=\u003e{tab.addEventListener('click',()=\u003eactivate(tab));tab.addEventListener('keydown',event=\u003e{const keys={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1};let next;if(event.key in keys)next=(index+keys[event.key]+tabs.length)%tabs.length;else if(event.key==='Home')next=0;else if(event.key==='End')next=tabs.length-1;else return;event.preventDefault();activate(tabs[next]);tabs[next].focus()})});\nconst exampleTabs=[...root.querySelectorAll('[data-sa-example]')];\nroving(exampleTabs,tab=\u003e{const example=examples[tab.dataset.saExample];exampleTabs.forEach(item=\u003e{item.setAttribute('aria-selected',String(item===tab));item.tabIndex=item===tab?0:-1});root.querySelector('#sa-example').setAttribute('aria-labelledby',tab.id);root.querySelector('[data-sa-example-title]').textContent=example.title;root.querySelector('[data-sa-example-copy]').textContent=example.copy;root.querySelector('[data-sa-example-access]').textContent=example.access;root.querySelector('[data-sa-example-limit]').textContent=example.limit;root.querySelector('[data-sa-example-code]').textContent=JSON.stringify(example.call,null,2);root.querySelector('[data-sa-copy-status]').textContent=''});\nconst clientTabs=[...root.querySelectorAll('[data-sa-client]')];\nroving(clientTabs,tab=\u003e{clientTabs.forEach(item=\u003e{const selected=item===tab;item.setAttribute('aria-selected',String(selected));item.tabIndex=selected?0:-1;const panel=root.querySelector('#'+item.getAttribute('aria-controls'));if(panel)panel.hidden=!selected})});\nconst copy=async(text,status)=\u003e{try{await navigator.clipboard.writeText(text);status.textContent='Copied'}catch{status.textContent='Select the text to copy it.'}};\nroot.querySelector('[data-sa-copy-example]')?.addEventListener('click',()=\u003ecopy(root.querySelector('[data-sa-example-code]').textContent,root.querySelector('[data-sa-copy-status]')));\nroot.querySelectorAll('[data-sa-copy-target]').forEach(button=\u003ebutton.addEventListener('click',()=\u003e{const target=root.querySelector('#'+button.dataset.saCopyTarget);copy(target?target.textContent:'',button.parentElement.querySelector('.sa-copy-status'))}));\nif(!matchMedia('(prefers-reduced-motion: reduce)').matches\u0026\u0026'IntersectionObserver'in window){const targets=root.querySelectorAll('.sa-groups,.sa-cards,.sa-access-grid,.sa-steps,.sa-guide,.sa-offer-grid');targets.forEach(target=\u003etarget.classList.add('sa-reveal'));root.classList.add('sa-motion-ready');const observer=new IntersectionObserver(entries=\u003eentries.forEach(entry=\u003e{if(entry.isIntersecting){entry.target.classList.add('sa-visible');observer.unobserve(entry.target)}}),{threshold:.06});targets.forEach(target=\u003eobserver.observe(target))}})();\n","jsLocation":"footer","format":false,"phpExec":false,"output":"inline"} /-->
