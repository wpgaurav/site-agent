ndex=\u00220\u0022\u003e\n        \u003cdiv class=\u0022sa-example-description\u0022\u003e\u003ch3 data-sa-example-title\u003eRead a Post Before Editing\u003c/h3\u003e\u003cp data-sa-example-copy\u003eGet the stored content and its SHA-256 hash. Updates must supply the current hash, so a changed draft can be detected before saving.\u003c/p\u003e\u003cspan class=\u0022sa-access-label\u0022 data-sa-example-access\u003eRead access\u003c/span\u003e\u003cp class=\u0022sa-small\u0022 data-sa-example-limit\u003ePublishing is a separate, explicit input to the content-write tool.\u003c/p\u003e\u003c/div\u003e\n        \u003cdiv class=\u0022sa-example-code\u0022\u003e\u003cspan class=\u0022sa-code-label\u0022\u003eMCP tool call\u003c/span\u003e\u003cpre\u003e\u003ccode data-sa-example-code\u003e{\n  \u0022name\u0022: \u0022site-agent-get-content\u0022,\n  \u0022arguments\u0022: {\n    \u0022post_id\u0022: 42\n  }\n}\u003c/code\u003e\u003c/pre\u003e\u003cbutton type=\u0022button\u0022 class=\u0022sa-copy\u0022 data-sa-copy\u003eCopy Example\u003c/button\u003e\u003cspan class=\u0022sa-copy-status\u0022 role=\u0022status\u0022 data-sa-copy-status\u003e\u003c/span\u003e\u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n    \u003cdiv class=\u0022sa-tool-index\u0022 aria-label=\u0022All Site Agent tools\u0022\u003e\n      \u003cdiv\u003e\u003ch3\u003eRead WordPress\u003c/h3\u003e\u003cul\u003e\u003cli\u003eSite context\u003c/li\u003e\u003cli\u003eContent search\u003c/li\u003e\u003cli\u003eRaw content\u003c/li\u003e\u003cli\u003eMedia discovery\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\n      \u003cdiv\u003e\u003ch3\u003eChange Content\u003c/h3\u003e\u003cul\u003e\u003cli\u003eCreate drafts\u003c/li\u003e\u003cli\u003eUpdate accessible posts and pages\u003c/li\u003e\u003cli\u003ePreserve omitted fields and block markup\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\n      \u003cdiv\u003e\u003ch3\u003eUse Developer Tools\u003c/h3\u003e\u003cul\u003e\u003cli\u003eBrowse and read source\u003c/li\u003e\u003cli\u003eEdit theme and plugin files\u003c/li\u003e\u003cli\u003eExecute PHP\u003c/li\u003e\u003cli\u003eRun foreground WP-CLI\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\u003c/section\u003e","css":"","js":"(()=\u003e{const root=document.querySelector('.sa');if(!root||root.dataset.saReady)return;root.dataset.saReady='true';const examples={content:{title:'Read a Post Before Editing',copy:'Get the stored content and its SHA-256 hash. Updates must supply the current hash, so a changed draft can be detected before saving.',access:'Read access',limit:'Publishing is a separate, explicit input to the content-write tool.',call:{name:'site-agent-get-content',arguments:{post_id:42}}},source:{title:'Edit the File You Actually Read',copy:'Read a theme or plugin source file and obtain its hash. A write checks that hash under a lock before replacing the content.',access:'Source inspection + source editing',limit:'PHP syntax is checked first. Source editing can change executable code and break a site.',call:{name:'site-agent-read-file',arguments:{path:'themes/your-theme/style.css'}}},php:{title:'Run PHP Inside WordPress',copy:'Execute PHP with WordPress, its APIs and loaded plugins available. Capture echoed output and a JSON-compatible return value.',access:'PHP execution opt-in',limit:'Full server privileges. This is not a sandbox; prior side effects may remain after an error.',call:{name:'site-agent-execute-php',arguments:{code:'return get_bloginfo(\u0022version\u0022);'}}},cli:{title:'Use the WordPress Command Line',copy:'Pass WP-CLI arguments as an array. Commands use this installation and the authenticated WordPress user, without a shell.',access:'WP-CLI execution opt-in',limit:'Foreground commands have a 20-second limit. WP-CLI and process execution must be available on the server.',call:{name:'site-agent-run-wp-cli',arguments:{arguments:['plugin','list','\u002d\u002dformat=json']}}}};const tabs=[...root.querySelectorAll('[data-sa-example]')];const select=tab=\u003e{const example=examples[tab.dataset.saExample];tabs.forEach(item=\u003e{item.setAttribute('aria-selected',String(item===tab));item.tabIndex=item===tab?0:-1});root.querySelector('#sa-example').setAttribute('aria-labelledby',tab.id);root.querySelector('[data-sa-example-title]').textContent=example.title;root.querySelector('[data-sa-example-copy]').textContent=example.copy;root.querySelector('[data-sa-example-access]').textContent=example.access;root.querySelector('[data-sa-example-limit]').textContent=example.limit;root.querySelector('[data-sa-example-code]').textContent=JSON.stringify(example.call,null,2);root.querySelector('[data-sa-copy-status]').textContent=''};tabs.forEach((tab,index)=\u003e{tab.addEventListener('click',()=\u003eselect(tab));tab.addEventListener('keydown',event=\u003e{let next=index;if(event.key==='ArrowRight')next=(index+1)%tabs.length;else if(event.key==='ArrowLeft')next=(index+tabs.length-1)%tabs.length;else if(event.key==='Home')next=0;else if(event.key==='End')next=tabs.length-1;else return;event.preventDefault();select(tabs[next]);tabs[next].focus()})});const copy=root.querySelector('[data-sa-copy]');copy?.addEventListener('click',async()=\u003e{const status=root.querySelector('[data-sa-copy-status]');try{await navigator.clipboard.writeText(root.querySelector('[data-sa-example-code]').textContent);status.textContent='Copied'}catch{status.textContent='Select the example to copy it.'}});if(!matchMedia('(prefers-reduced-motion: reduce)').matches\u0026\u0026'IntersectionObserver'in window){const targets=root.querySelectorAll('.sa-section-grid,.sa-tool-index,.sa-boundary-grid,.sa-steps,.sa-offer-grid');targets.forEach(target=\u003etarget.classList.add('sa-reveal'));root.classList.add('sa-motion-ready');const observer=new IntersectionObserver(entries=\u003eentries.forEach(entry=\u003e{if(entry.isIntersecting){entry.target.classList.add('sa-visible');observer.unobserve(entry.target)}}),{threshold:.08});targets.forEach(target=\u003eobserver.observe(target))}})();\n","jsLocation":"footer","format":false,"phpExec":false,"output":"inline"} /-->

<!-- wp:gt-page-block/page-block {"name":"Access Boundaries","blockId":0,"blockSlug":"","content":"\u003csection class=\u0022sa-boundaries sa-deep\u0022 aria-labelledby=\u0022sa-boundaries-title\u0022\u003e\n  \u003cdiv class=\u0022sa-wrap sa-boundary-grid\u0022\u003e\n    \u003cdiv\u003e\u003ch2 id=\u0022sa-boundaries-title\u0022\u003eAccess You Can Inspect and Revoke\u003c/h2\u003e\u003cp class=\u0022sa-section-lead\u0022\u003eThe plugin checks the current user's permissions and enabled tools again for every call.\u003c/p\u003e\u003cp\u003eEnable Site Agent for basic site and content reads. Turn on each additional tool group separately. Revoke the Application Password or disable Site Agent to stop access.\u003c/p\u003e\u003ca class=\u0022sa-text-link\u0022 href=\u0022https://github.com/wpgaurav/site-agent#security-and-access\u0022 target=\u0022_blank\u0022 rel=\u0022noopener nofollow\u0022\u003eRead the Access Model \u003cspan aria-hidden=\u0022true\u0022\u003e↗\u003c/span\u003e\u003c/a\u003e\u003c/div\u003e\n    \u003cdiv class=\u0022sa-permission-matrix\u0022\u003e\u003cdiv class=\u0022sa-matrix-head\u0022\u003e\u003cspan\u003eEntry point\u003c/span\u003e\u003cspan\u003eDefault\u003c/span\u003e\u003c/div\u003e\u003cdiv\u003e\u003cspan\u003eContent writes\u003c/span\u003e\u003cspan\u003eOff\u003c/span\u003e\u003c/div\u003e\u003cdiv\u003e\u003cspan\u003eSource inspection\u003c/span\u003e\u003cspan\u003eOff\u003c/span\u003e\u003c/div\u003e\u003cdiv\u003e\u003cspan\u003eSource editing\u003c/span\u003e\u003cspan\u003eOff\u003c/span\u003e\u003c/div\u003e\u003cdiv\u003e\u003cspan\u003ePHP execution\u003c/span\u003e\u003cspan\u003eOff\u003c/span\u003e\u003c/div\u003e\u003cdiv\u003e\u003cspan\u003eWP-CLI execution\u003c/span\u003e\u003cspan\u003eOff\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\u0022sa-matrix-note\u0022\u003eConnections are also off until enabled.\u003c/div\u003e\u003c/div\u003e\n  \u003c/div\u003e\n  \u003cdiv class=\u0022sa-wrap sa-privilege-note\u0022\u003e\u003ch3\u003eDeveloper Access Is Full Access\u003c/h3\u003e\u003cp\u003ePHP execution, executable file editing and WP-CLI can change the database, files or other settings. The switches control entry points; they aren't a sandbox. Use these tools with trusted clients on a backed-up development or staging site.\u003c/p\u003e\u003c/div\u003e\n\u003c/section\u003e","css":"","js":"","jsLocation":"footer","format":false,"phpExec":false,"output":"inline"} /-->

<!-- wp:gt-page-block/page-block {"name":"Connection Setup","blockId":0,"blockSlug":"","content":"\u003csection class=\u0022sa-setup\u0022 id=\u0022sa-setup\u0022 aria-labelledby=\u0022sa-setup-title\u0022\u003e\n  \u003cdiv class=\u0022sa-wrap sa-section-grid\u0022\u003e\u003cdiv\u003e\u003ch2 id=\u0022sa-setup-title\u0022\u003eConnect Your WordPress Site\u003c/h2\u003e\u003cp class=\u0022sa-section-lead\u0022\u003eUse an MCP client that supports Streamable HTTP and an Authorization header.\u003c/p\u003e\u003c/div\u003e\u003cul class=\u0022sa-requirements\u0022\u003e\u003cli\u003eWordPress 6.9 or newer\u003c/li\u003e\u003cli\u003ePHP 8.0 or newer\u003c/li\u003e\u003cli\u003eHTTPS for remote connections\u003c/li\u003e\u003cli\u003eAdministrator access; super administrator on multisite\u003c/li\u003e\u003c/ul\u003e\u003c/div\u003e\n  \u003cdiv class=\u0022sa-wrap sa-steps\u0022\u003e\u003cdiv\u003e\u003cspan\u003e1\u003c/span\u003e\u003ch3\u003eInstall the Plugin\u003c/h3\u003e\u003cp\u003eUpload the complete ZIP in WordPress. Open Tools → Site Agent.\u003c/p\u003e\u003c/div\u003e\u003cdiv\u003e\u003cspan\u003e2\u003c/span\u003e\u003ch3\u003eSelect the Tools\u003c/h3\u003e\u003cp\u003eEnable access and the groups your task needs. Save the settings.\u003c/p\u003e\u003c/div\u003e\u003cdiv\u003e\u003cspan\u003e3\u003c/span\u003e\u003ch3\u003eCreate a Password\u003c/h3\u003e\u003cp\u003eCreate a dedicated Application Password in your WordPress profile.\u003c/p\u003e\u003c/div\u003e\u003cdiv\u003e\u003cspan\u003e4\u003c/span\u003e\u003ch3\u003eConnect the Client\u003c/h3\u003e\u003cp\u003eUse the endpoint and authentication template shown in Site Agent.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\n  \u003cdiv class=\u0022sa-wrap sa-endpoint\u0022\u003e\u003cspan\u003eEndpoint\u003c/span\u003e\u003ccode\u003ehttps://your-site.com/wp-json/site-agent/v1/mcp\u003c/code\u003e\u003cspan\u003eUse the exact URL shown on your site.\u003c/span\u003e\u003c/div\u003e\n\u003c/section\u003e","css":"","js":"","jsLocation":"footer","format":false,"phpExec":false,"output":"inline"} /-->

<!-- wp:gt-page-block/page-block {"name":"Free Offer","blockId":0,"blockSlug":"","content":"\u003csection class=\u0022sa-offer sa-alt\u0022 id=\u0022sa-download\u0022 aria-labelledby=\u0022sa-download-title\u0022\u003e\n  \u003cdiv class=\u0022sa-wrap sa-offer-grid\u0022\u003e\u003cdiv\u003e\u003ch2 id=\u0022sa-download-title\u0022\u003eSite Agent Is Free\u003c/h2\u003e\u003cp class=\u0022sa-section-lead\u0022\u003eGet the complete plugin and a free license for automatic updates.\u003c/p\u003e\u003cp\u003eThe code is public and GPL-licensed. License activation controls update delivery; it doesn't switch off your tools or block access to your site.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0022sa-offer-action\u0022\u003e\u003cdiv class=\u0022sa-price\u0022\u003e\u003cstrong\u003e$0\u003c/strong\u003e\u003cspan\u003eFree plugin + update license\u003c/span\u003e\u003c/div\u003e\u003ca class=\u0022sa-button sa-button-primary\u0022 href=\u0022https://gauravtiwari.org/?fluent-cart=instant_checkout\u0026item_id=131\u0026quantity=1\u0022 data-sa-cta=\u0022offer\u0022\u003eGet Site Agent \u003cspan aria-hidden=\u0022true\u0022\u003e↗\u003c/span\u003e\u003c/a\u003e\u003cp class=\u0022sa-small\u0022\u003eFree checkout gives you the download and license key in your account.\u003c/p\u003e\u003ca class=\u0022sa-text-link\u0022 href=\u0022https://github.com/wpgaurav/site-agent\u0022 target=\u0022_blank\u0022 rel=\u0022noopener nofollow\u0022\u003eBrowse the Source on GitHub \u003cspan aria-hidden=\u0022true\u0022\u003e↗\u003c/span\u003e\u003c/a\u003e\u003c/div\u003e\u003c/div\u003e\n\u003c/section\u003e","css":"","js":"","jsLocation":"footer","format":false,"phpExec":false,"output":"inline"} /-->

<!-- wp:gt-page-block/page-block {"name":"Questions","blockId":0,"blockSlug":"","content":"\u003csection class=\u0022sa-faq\u0022 aria-labelledby=\u0022sa-faq-title\u0022\u003e\n  \u003cdiv class=\u0022sa-wrap sa-section-grid\u0022\u003e\u003cdiv\u003e\u003ch2 id=\u0022sa-faq-title\u0022\u003eBefore You Connect\u003c/h2\u003e\u003cp class=\u0022sa-section-lead\u0022\u003eCheck the client, privacy and developer-access boundaries before enabling tools.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\u0022sa-questions\u0022\u003e\n    \u003cdetails\u003e\u003csummary\u003eWhich AI clients can connect?\u003cspan aria-hidden=\u0022true\u0022\u003e+\u003c/span\u003e\u003c/summary\u003e\u003cp\u003eUse a client with Streamable HTTP and custom Authorization headers, or a compatible Application Password bridge. Site Agent doesn't include OAuth. Clients that require an OAuth-only connection need a bridge.\u003c/p\u003e\u003c/details\u003e\n    \u003cdetails\u003e\u003csummary\u003eDoes my data pass through a hosted service?\u003cspan aria-hidden=\u0022true\u0022\u003e+\u003c/span\u003e\u003c/summary\u003e\u003cp\u003eSite Agent has no hosted proxy or telemetry. Your chosen client connects directly to WordPress. The client's handling of tool results depends on that client or AI provider's policy. PHP and WP-CLI can make outbound requests when instructed.\u003c/p\u003e\u003c/details\u003e\n    \u003cdetails\u003e\u003csummary\u003eCan I use developer tools on production?\u003cspan aria-hidden=\u0022true\u0022\u003e+\u003c/span\u003e\u003c/summary\u003e\u003cp\u003eUse a backed-up development or staging site for PHP execution, file editing and WP-CLI. These tools run with server privileges and can break a site. Syntax checks and access switches don't contain arbitrary code or replace backups.\u003c/p\u003e\u003c/details\u003e\n    \u003cdetails\u003e\u003csummary\u003eWhat can the file tools reach?\u003cspan aria-hidden=\u0022true\u0022\u003e+\u003c/span\u003e\u003c/summary\u003e\u003cp\u003eFile tools are limited to theme and plugin directories. Hidden, configuration, credential and symlink paths are blocked. Source files can still contain sensitive data. Writes require the current file hash, or an explicit new-file value, and PHP syntax is checked before a write.\u003c/p\u003e\u003c/details\u003e\n    \u003cdetails\u003e\u003csummary\u003eHow do automatic updates work?\u003cspan aria-hidden=\u0022true\u0022\u003e+\u003c/span\u003e\u003c/summary\u003e\u003cp\u003eComplete the free checkout, then activate the license in Site Agent. FluentCart supplies update metadata and the protected download. The license affects automatic updates only. You can also install a complete release ZIP manually.\u003c/p\u003e\u003c/details\u003e\n    \u003cdetails\u003e\u003csummary\u003eWhat isn't included?\u003cspan aria-hidden=\u0022true\u0022\u003e+\u003c/span\u003e\u003c/summary\u003e\u003cp\u003eThis version doesn't include OAuth, an AI chat interface, background WP-CLI jobs or a recoverable PHP sandbox. The bundled official MCP Adapter is a pinned 0.7.0 prerelease. PHP runs in the WordPress request and isn't isolated from the site.\u003c/p\u003e\u003c/details\u003e\n  \u003c/div\u003e\u003c/div\u003e\n\u003c/section\u003e","css":"","js":"","jsLocation":"footer","format":false,"phpExec":false,"output":"inline"} /-->
