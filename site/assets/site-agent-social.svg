<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="sa-social-title sa-social-desc">
  <title id="sa-social-title">Site Agent for WordPress</title>
  <desc id="sa-social-desc">Site Agent connects MCP-compatible clients to WordPress with selectable content, source, PHP and WP-CLI tools.</desc>
  <g id="sa-social-canvas"><rect width="1200" height="630" fill="#0f0f0f"/><path d="M64 72H1136M64 558H1136" fill="none" stroke="#3a3431" stroke-width="2"/></g>
  <g id="sa-social-wordmark" fill="#fffffc" font-family="GTReallySans, sans-serif" font-weight="800">
    <text x="64" y="246" font-size="112">Site Agent</text>
  </g>
  <g id="sa-social-copy" fill="#e4e4e4" font-family="Finlandica Text, sans-serif" font-weight="400">
    <text x="68" y="340" font-size="46">WordPress, open to your agent.</text>
    <text x="68" y="418" font-size="42" fill="#e8836f">Content. Source. PHP. WP-CLI.</text>
  </g>
  <g id="sa-social-brackets" fill="none" stroke="#fffffc" stroke-width="12" stroke-linecap="square">
    <path d="M928 152H888V478H928M1096 152H1136V478H1096"/>
  </g>
  <g id="sa-social-agent" fill="none" stroke="#e8836f" stroke-width="12"><path d="M938 426L1012 220L1086 426M965 346H1059"/></g>
  <g id="sa-social-nodes" fill="#2dd4bf"><circle cx="938" cy="426" r="10"/><circle cx="1012" cy="220" r="10"/><circle cx="1086" cy="426" r="10"/></g>
</svg>
